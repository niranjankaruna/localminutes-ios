name: LocalMinutes
options:
  minimumXcodeGenVersion: 2.46.0
  xcodeVersion: '26.2'
  deploymentTarget:
    iOS: '18.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '1'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGNING_ALLOWED: 'NO'
targets:
  LocalMinutes:
    type: application
    platform: iOS
    sources:
      - App
      - Core
      - Recording
      - Shared
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: LocalMinutes
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LocalMinutesSourceCommit: $(LOCALMINUTES_SOURCE_COMMIT)
        NSMicrophoneUsageDescription: Record meetings you explicitly start and transcribe them on this iPhone.
        UIBackgroundModes: [audio]
        NSSupportsLiveActivities: true
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.niranjankaruna.localminutes
        PRODUCT_NAME: LocalMinutes
        GENERATE_INFOPLIST_FILE: 'NO'
      configs:
        Debug:
          ENABLE_TESTABILITY: 'YES'
    dependencies:
      - target: LocalMinutesLiveActivity
        embed: true
        codeSign: false
  LocalMinutesLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - LiveActivityExtension
      - Shared
    info:
      path: LiveActivityExtension/Info.plist
      properties:
        CFBundleDisplayName: LocalMinutes
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LocalMinutesSourceCommit: $(LOCALMINUTES_SOURCE_COMMIT)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.niranjankaruna.localminutes.LiveActivity
        PRODUCT_NAME: LocalMinutesLiveActivity
        APPLICATION_EXTENSION_API_ONLY: 'YES'
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: '$(inherited) LOCALMINUTES_EXTENSION'
        SKIP_INSTALL: 'YES'
        GENERATE_INFOPLIST_FILE: 'NO'
  LocalMinutesAppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: '18.0'
    sources:
      - Tests/RecordingTests/RecordingSessionOwnerTests.swift
      - Tests/NativeAppTests
    dependencies:
      - target: LocalMinutes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.niranjankaruna.localminutes.AppTests
        GENERATE_INFOPLIST_FILE: 'YES'
        CODE_SIGNING_ALLOWED: 'NO'
  LocalMinutesUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: '18.0'
    sources:
      - Tests/NativeUITests
    dependencies:
      - target: LocalMinutes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.niranjankaruna.localminutes.UITests
        GENERATE_INFOPLIST_FILE: 'YES'
        CODE_SIGNING_ALLOWED: 'NO'
schemes:
  LocalMinutes:
    build:
      targets:
        LocalMinutes: all
        LocalMinutesAppTests: [test]
        LocalMinutesUITests: [test]
    test:
      config: Debug
      targets:
        - name: LocalMinutesAppTests
          parallelizable: false
        - name: LocalMinutesUITests
          parallelizable: false
    run:
      config: Debug
    archive:
      config: Release
