name: LocalMinutes
options:
  minimumXcodeGenVersion: 2.46.0
  xcodeVersion: '26.2'
  deploymentTarget:
    iOS: '18.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '1'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGNING_ALLOWED: 'NO'
targets:
  LocalMinutes:
    type: application
    platform: iOS
    sources:
      - App
      - Core
      - Recording
      - Shared
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: LocalMinutes
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LocalMinutesSourceCommit: $(LOCALMINUTES_SOURCE_COMMIT)
        NSMicrophoneUsageDescription: Record meetings you explicitly start and transcribe them on this iPhone.
        UIBackgroundModes: [audio]
        NSSupportsLiveActivities: true
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.niranjankaruna.localminutes
        PRODUCT_NAME: LocalMinutes
        GENERATE_INFOPLIST_FILE: 'NO'
    dependencies:
      - target: LocalMinutesLiveActivity
        embed: true
        codeSign: false
  LocalMinutesLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - LiveActivityExtension
      - Shared
    info:
      path: LiveActivityExtension/Info.plist
      properties:
        CFBundleDisplayName: LocalMinutes
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LocalMinutesSourceCommit: $(LOCALMINUTES_SOURCE_COMMIT)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.niranjankaruna.localminutes.LiveActivity
        PRODUCT_NAME: LocalMinutesLiveActivity
        APPLICATION_EXTENSION_API_ONLY: 'YES'
        SKIP_INSTALL: 'YES'
        GENERATE_INFOPLIST_FILE: 'NO'
schemes:
  LocalMinutes:
    build:
      targets:
        LocalMinutes: all
    run:
      config: Debug
    archive:
      config: Release
