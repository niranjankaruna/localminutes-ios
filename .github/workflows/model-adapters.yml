name: Model adapters and transfers

on:
  push:
    branches: [codex/parakeet-downloads]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: localminutes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  models:
    runs-on: macos-15-intel
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify exact source and standard free-runner guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path('project-config.json').read_text())
          assert config['github']['visibility'] == 'public' and config['github']['publicationApproved']
          assert config['ci']['costGuardVerified'] and config['budget']['maximumAdditionalSpendEUR'] == 0
          assert not config['budget']['allowLargerRunners']
          PY
      - name: Prepare independent model-module test package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .agent-local/model-tests/Tests
          cp -R Core Models .agent-local/model-tests/
          cp -R Tests/ModelTests .agent-local/model-tests/Tests/
          cat > .agent-local/model-tests/Package.swift <<'SWIFT'
          // swift-tools-version: 6.2
          import PackageDescription
          let package = Package(name: "ModelContracts", platforms: [.macOS(.v15)], targets: [
              .target(name: "LocalMinutesCore", path: "Core"),
              .target(name: "LocalMinutesModels", dependencies: ["LocalMinutesCore"], path: "Models"),
              .testTarget(name: "ModelTests", dependencies: ["LocalMinutesModels", "LocalMinutesCore"], path: "Tests/ModelTests")
          ])
          SWIFT
      - name: Run actual model, transfer and large-file memory assertions
        shell: bash
        run: |
          set -euo pipefail
          swift test --package-path .agent-local/model-tests 2>&1 | tee .agent-local/model-tests.log
      - name: Require discovered memory and transfer assertions
        if: always()
        run: |
          node scripts/verify-test-log.mjs .agent-local/model-tests.log \
            testLargeDownloadVerificationAndReopenKeepPeakMemoryIndependentOfFileSize \
            testActualHTTPTransferReportsByteProgressThenVerificationBeforeCompletion
      - name: Run unchanged script regressions on a platform supporting symlinks
        if: always()
        run: node --test scripts/tests/*.test.mjs
