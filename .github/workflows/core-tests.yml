name: Core tests

on:
  push:
    branches: ['task/**']
    paths:
      - 'Package.swift'
      - 'Core/**'
      - 'Tests/**'
      - 'scripts/**'
      - '.github/workflows/core-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: localminutes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: macos-15-intel
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify source and record actual toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path('project-config.json').read_text())
          assert config['ci']['costGuardVerified'] is True, 'CI cost guard is unverified'
          assert config['budget']['maximumAdditionalSpendEUR'] == 0
          assert config['budget']['allowLargerRunners'] is False
          assert Path(config['ci']['costGuardEvidence'].split('#')[0]).is_file()
          PY
          printf 'SOURCE_SHA=%s\nRUNNER_IMAGE=%s\nRUNNER_OS=%s\n' "$GITHUB_SHA" "$ImageVersion" "$RUNNER_OS"
          sw_vers
          uname -m
          xcodebuild -version
          xcodebuild -showsdks
          swift --version
          xcrun simctl list devices available
      - name: Execute XCTest assertions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build
          node --test scripts/tests/verify-test-log.test.mjs
          swift test --enable-code-coverage 2>&1 | tee .build/test-output.log
      - name: Require discovered tests and report evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-test-log.mjs .build/test-output.log testHarnessExecutesAnAssertion testControlledClockAdvancesWithoutSleeping testConcurrentStartsEmitExactlyOnePreparation testConcurrentStopsEmitExactlyOneFlushAndCompleteOnlyAfterAcknowledgement testInterruptionDuringActivationRejectsLateRecordingSuccess
