  # Owner-requested MVP delivery: compile/package only, no test runner or model weights.
  # The workflow definition and the reviewed app source are recorded separately.
  mvp-package:
    if: ${{ inputs.mode == 'mvp' || inputs.mode == 'features' }}
    runs-on: macos-15-intel
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      EXPECTED_SOURCE: ${{ inputs.mode == 'features' && github.sha || inputs.sourceCommit }}
      DELIVERY_MODE: ${{ inputs.mode }}
    steps:
      - name: Check out the exact selected app source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.mode == 'features' && github.sha || inputs.sourceCommit }}
          persist-credentials: false
      - name: Verify exact reviewed source and zero-spend packaging guard
        shell: bash
        run: |
          set -euo pipefail
          if [ "$DELIVERY_MODE" = 'features' ]; then
            test "$EXPECTED_SOURCE" = "$GITHUB_SHA"
          else
            test "$EXPECTED_SOURCE" = 'db1b8d51c5ff72bf1d8abfd13f99a1da06a11e04'
          fi
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          python3 - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path('project-config.json').read_text())
          assert config['ci']['costGuardVerified'] is True
          assert config['budget']['maximumAdditionalSpendEUR'] == 0
          assert config['budget']['allowLargerRunners'] is False
          assert config['github']['publicationApproved'] is True
          assert config['github']['visibility'] == 'public'
          PY
          printf 'MVP_APP_SOURCE=%s\nWORKFLOW_SOURCE=%s\nTESTS_EXECUTED=0\n' "$EXPECTED_SOURCE" "$GITHUB_SHA"
      - name: Prepare the pinned native framework without model weights
        shell: bash
        run: |
          set -euo pipefail
          python3 docs/drafts/T17/prepare_native_summary.py --framework-only
      - name: Generate the reviewed iPhone project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .agent-local/tools
          curl --fail --location --proto '=https' --proto-redir '=https' --retry 2 --retry-delay 4 --max-time 120 \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip -o .agent-local/tools/xcodegen.zip
          test "$(wc -c < .agent-local/tools/xcodegen.zip | tr -d ' ')" = '4278764'
          printf '%s  %s\n' '4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806' '.agent-local/tools/xcodegen.zip' | shasum -a 256 -c -
          unzip -q .agent-local/tools/xcodegen.zip -d .agent-local/tools
          .agent-local/tools/xcodegen/bin/xcodegen generate --spec project.yml
      - name: Compile the iPhone app and embedded Live Activity extension
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -quiet -project LocalMinutes.xcodeproj -scheme LocalMinutes -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build/device \
            -clonedSourcePackagesDirPath .agent-local/source-packages \
            CODE_SIGNING_ALLOWED=NO LOCALMINUTES_SOURCE_COMMIT="$EXPECTED_SOURCE" build
      - name: Package the unsigned IPA and record its checksum
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import { createUnsignedIPA } from './scripts/package-ios.mjs';
          import { readFileSync } from 'node:fs';
          const result = await createUnsignedIPA({
            appPath: 'build/device/Build/Products/Release-iphoneos/LocalMinutes.app',
            outputDirectory: 'build/package', sourceCommit: process.env.EXPECTED_SOURCE
          });
          console.log(readFileSync(result.manifestPath, 'utf8'));
          console.log(readFileSync(result.checksumPath, 'utf8'));
          JS
      - name: Retain the package in the existing unpublished owner draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MVP_TAG="mvp-preview-${EXPECTED_SOURCE:0:12}"
          gh release view "$MVP_TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,tagName,targetCommitish > .agent-local/mvp-release.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          release = json.loads(Path('.agent-local/mvp-release.json').read_text())
          assert release['isDraft'] is True, 'MVP assets must stay unpublished'
          assert release['targetCommitish'] == os.environ['EXPECTED_SOURCE']
          assert release['tagName'] == 'mvp-preview-' + os.environ['EXPECTED_SOURCE'][:12]
          PY
          gh release upload "$MVP_TAG" --repo "$GITHUB_REPOSITORY" \
            build/package/*.ipa build/package/*.sha256 build/package/build-manifest.json

  # One end-of-batch real-model observation per independent flow, in parallel.
  # Existing full validation is preserved separately; no per-change test loop.
  feature-model-check:
    if: ${{ inputs.mode == 'features' }}
    name: Local model (${{ matrix.flow }})
    runs-on: macos-15-intel
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - flow: service
            filter: ActualIntelligenceCompositionTests
            cases: testDefaultPinnedQwenServiceSavesSummaryAndSelectedAnswerThenReleasesActualInstallation
          - flow: summary
            filter: ActualSummaryPipelineTests
            cases: testActualQwenMapsAndValidatesGroundedDecisionsActionsAndUnknownAttributes
          - flow: questions
            filter: ActualQwenMeetingQuestionTests
            cases: testActualPinnedQwenAnswersSelectedBudgetAndPreservesUnknownOwnerDespiteOtherMeetingAnswer
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      MODEL_FILTER: ${{ matrix.filter }}
      MODEL_CASE: ${{ matrix.cases }}
    steps:
      - name: Check out exact batched source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify zero-spend guard and prepare the actual pinned model
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import json
          from pathlib import Path
          c = json.loads(Path('project-config.json').read_text())
          assert c['ci']['costGuardVerified'] is True
          assert c['budget']['maximumAdditionalSpendEUR'] == 0
          assert c['budget']['allowLargerRunners'] is False
          assert c['github']['visibility'] == 'public'
          PY
          python3 docs/drafts/T17/prepare_native_summary.py
      - name: Exercise this actual local-model flow once
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build
          swift test --filter "$MODEL_FILTER" 2>&1 | tee .build/feature-model-output.log
      - name: Record the actual flow result without hiding failures
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-test-log.mjs .build/feature-model-output.log "$MODEL_CASE"
