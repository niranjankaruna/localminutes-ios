name: Core tests

on:
  push:
    branches: ['task/**']
    paths:
      - 'Package.swift'
      - 'Core/**'
      - 'Recording/**'
      - 'Tests/**'
      - 'scripts/**'
      - 'project.yml'
      - 'App/**'
      - 'Shared/**'
      - 'LiveActivityExtension/**'
      - '.github/workflows/core-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: localminutes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: macos-15-intel
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify source and record actual toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path('project-config.json').read_text())
          assert config['ci']['costGuardVerified'] is True, 'CI cost guard is unverified'
          assert config['budget']['maximumAdditionalSpendEUR'] == 0
          assert config['budget']['allowLargerRunners'] is False
          assert Path(config['ci']['costGuardEvidence'].split('#')[0]).is_file()
          PY
          printf 'SOURCE_SHA=%s\nRUNNER_IMAGE=%s\nRUNNER_OS=%s\n' "$GITHUB_SHA" "$ImageVersion" "$RUNNER_OS"
          sw_vers
          uname -m
          xcodebuild -version
          xcodebuild -showsdks
          swift --version
          xcrun simctl list devices available
      - name: Execute XCTest assertions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build
          swift test --enable-code-coverage 2>&1 | tee .build/test-output.log
          node --test scripts/tests/*.test.mjs
      - name: Require discovered tests and report evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-test-log.mjs .build/test-output.log testHarnessExecutesAnAssertion testControlledClockAdvancesWithoutSleeping testConcurrentStartsEmitExactlyOnePreparation testConcurrentStopsEmitExactlyOneFlushAndCompleteOnlyAfterAcknowledgement testInterruptionDuringActivationRejectsLateRecordingSuccess testAcceptedPCMIsOwnedAndSurvivesSourceMutation testSequenceCountersWrapWithoutLosingFullEmptyFIFOOrLossState testParallelSPSCStressPreservesAcceptedSamplesOrderAndAllDroppedFrames testRealConversionProduces16kMonoAndPreservesDuration testRealCAFSegmentsContain16BitMonoSamplesAndPersistManifest testCompletedSegmentIsReadableAndCheckpointedBeforeFinish testFailedNativeDrainRemainsAnExplicitTerminalFailure testNativeAppendFailureCannotBeFinishedAsSuccessOrReentered
      - name: Exercise queue under Thread Sanitizer
        shell: bash
        run: |
          set -euo pipefail
          swift test --sanitize=thread --filter OwnedPCMQueueTests 2>&1 | tee .build/queue-tsan.log
          node scripts/verify-test-log.mjs .build/queue-tsan.log testParallelSPSCStressPreservesAcceptedSamplesOrderAndAllDroppedFrames testFinishDrainsQueuedFIFOAndReportsTrailingLossExactlyOnce

  native-build:
    needs: core
    runs-on: macos-15-intel
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify pinned XcodeGen archive and generate project
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p .agent-local/tools
          curl --fail --location --proto '=https' --proto-redir '=https' --retry 2 --retry-delay 4 --max-time 120 \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip \
            -o .agent-local/tools/xcodegen.zip
          test "$(wc -c < .agent-local/tools/xcodegen.zip | tr -d ' ')" = '4278764'
          printf '%s  %s\n' '4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806' '.agent-local/tools/xcodegen.zip' | shasum -a 256 -c -
          unzip -q .agent-local/tools/xcodegen.zip -d .agent-local/tools
          .agent-local/tools/xcodegen/bin/xcodegen --version | tee .agent-local/xcodegen-version.log
          grep -Fx 'Version: 2.46.0' .agent-local/xcodegen-version.log
          .agent-local/tools/xcodegen/bin/xcodegen generate --spec project.yml
      - name: Compile actual device and simulator products without signing
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -quiet -project LocalMinutes.xcodeproj -scheme LocalMinutes -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO LOCALMINUTES_SOURCE_COMMIT="$GITHUB_SHA" build
          xcodebuild -quiet -project LocalMinutes.xcodeproj -scheme LocalMinutes -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/simulator CODE_SIGNING_ALLOWED=NO LOCALMINUTES_SOURCE_COMMIT="$GITHUB_SHA" build
      - name: Inspect compiled plists and Mach-O products
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/native-tests/device-build.test.mjs
      - name: Test real unsigned archive packaging
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/native-tests/package.test.mjs
      - name: Create and verify ephemeral unsigned package without uploading
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import { createUnsignedIPA } from './scripts/package-ios.mjs';
          import { readFileSync } from 'node:fs';
          const result = await createUnsignedIPA({
            appPath: 'build/device/Build/Products/Release-iphoneos/LocalMinutes.app',
            outputDirectory: 'build/package', sourceCommit: process.env.GITHUB_SHA
          });
          console.log(readFileSync(result.manifestPath, 'utf8'));
          console.log(readFileSync(result.checksumPath, 'utf8'));
          JS
