name: Core tests

on:
  push:
    branches: ['task/**']
    paths:
      - 'Package.swift'
      - 'Core/**'
      - 'Recording/**'
      - 'Models/**'
      - 'Persistence/**'
      - 'Transcription/**'
      - 'MeetingLibrary/**'
      - 'Summaries/**'
      - 'Tests/**'
      - 'scripts/**'
      - 'project.yml'
      - 'App/**'
      - 'Shared/**'
      - 'LiveActivityExtension/**'
      - '.github/workflows/core-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: localminutes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: macos-15-intel
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify source and record actual toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path('project-config.json').read_text())
          assert config['ci']['costGuardVerified'] is True, 'CI cost guard is unverified'
          assert config['budget']['maximumAdditionalSpendEUR'] == 0
          assert config['budget']['allowLargerRunners'] is False
          assert Path(config['ci']['costGuardEvidence'].split('#')[0]).is_file()
          PY
          printf 'SOURCE_SHA=%s\nRUNNER_IMAGE=%s\nRUNNER_OS=%s\n' "$GITHUB_SHA" "$ImageVersion" "$RUNNER_OS"
          sw_vers
          uname -m
          xcodebuild -version
          xcodebuild -showsdks
          swift --version
          xcrun simctl list devices available
      - name: Prepare verified licensed real speech and pinned model fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 docs/drafts/T10/prepare_native_fixture.py
          printf 'LOCALMINUTES_ASR_MODEL_DIRECTORY=%s/.agent-local/asr-evaluation/native-fixtures/model\n' "$PWD" >> "$GITHUB_ENV"
          printf 'LOCALMINUTES_ASR_FIXTURE_PATH=%s/.agent-local/asr-evaluation/native-fixtures/6930-75918-0000.flac\n' "$PWD" >> "$GITHUB_ENV"
      - name: Prepare pinned native summary framework and actual Qwen model
        shell: bash
        run: |
          set -euo pipefail
          python3 docs/drafts/T17/prepare_native_summary.py --framework-only
      - name: Execute XCTest assertions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build
          swift test --enable-code-coverage --filter '(HarnessTests|CoreTests|RecordingTests|ModelTests|PersistenceTests|ASRTests|MeetingLibraryTests|SummaryPromptFormatterTests|StructuredJSONSchemaTests)' 2>&1 | tee .build/test-output.log
          node --test scripts/tests/*.test.mjs
      - name: Require discovered tests and report evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-test-log.mjs .build/test-output.log testHarnessExecutesAnAssertion testControlledClockAdvancesWithoutSleeping testConcurrentStartsEmitExactlyOnePreparation testConcurrentStopsEmitExactlyOneFlushAndCompleteOnlyAfterAcknowledgement testInterruptionDuringActivationRejectsLateRecordingSuccess testAcceptedPCMIsOwnedAndSurvivesSourceMutation testSequenceCountersWrapWithoutLosingFullEmptyFIFOOrLossState testParallelSPSCStressPreservesAcceptedSamplesOrderAndAllDroppedFrames testRealConversionProduces16kMonoAndPreservesDuration testRealCAFSegmentsContain16BitMonoSamplesAndPersistManifest testCompletedSegmentIsReadableAndCheckpointedBeforeFinish testFailedNativeDrainRemainsAnExplicitTerminalFailure testNativeAppendFailureCannotBeFinishedAsSuccessOrReentered testConcurrentCloseWaitsForAdmittedWorkAndPublishesItToTheStopper testSequentialAdmissionsOnDifferentThreadsPublishThePreviousCallbacksWork testActualQueueResamplingAndSixteenBitCAFDecodePreserveTheSignal testStopWaitsForAnAdmittedCallbackThenDrainsBeforeDeactivationAndAcknowledgement testMissingEndDoesNotAcknowledgeCleanupAndCanBeRetried testQueuedUpdateCannotReuseResourceAfterEarlierLookupFails testActualOwnedAudioReachesRecordingOnlyWithAllThreeFactsAndProducesRealCAF testHeldActivityEndKeepsCleanupPendingAfterRealAudioFlushAndDeactivation testToggleDuringDomainReservationCancelsTheAdmittedStart testCancellingStartDuringPermissionReleasesTheActivityAndOwner testIntentStopAcknowledgesActualSavedCAFOnlyAfterCleanup testIntentStaleLockScreenStopCannotStopAReplacementAndMatchingOwnerStopWorks testIntentCannotAttributeAReplacementManifestToAnEarlierStopOrToggle testPinnedSpeechManifestHasOneImmutableCompatibleSetAndHonestDigestProvenance testValidLocalImportCopiesHashesAndPersistsLicenseWithoutChangingSource testReopenedManagerReturnsTheSameVerifiedPersistentInstallation testMissingRequiredFileIsRejectedWithoutPublishingAPointer testTruncatedRequiredFileIsRejectedBeforePublishing testSameSizeCorruptionFailsActualSHA256Verification testUnexpectedFileCannotBeImportedAlongsideModelWeights testSymlinkedRequiredFileIsRejectedWithoutReadingOutsideImport testUnsafeModelAndArtifactNamesCannotEscapePersistentRoot testUnpinnedRevisionMissingLicenseAndMalformedDigestAreRejected testDuplicateRolesAndDuplicateNamesCannotCreateAmbiguousVerifiedHandle testInsufficientDiskSpaceDoesNotCreatePartialInstallation testDownloadBoundaryWritesOnlyOwnedStagingAndProducesVerifiedFiles testDownloadFailurePreservesPreviousPointerAndCleansPartialFiles testCancelledReplacementLeavesPreviousUsableInstallationAndNoStaging testInProgressReplacementKeepsCurrentReadableUntilVerifiedAtomicPublication testFailedImportCannotReplacePreviousUsableModel testInstalledModelIsRehashedBeforeItCanBeLeased testLeasePreventsDeletionUntilTheExactLeaseIsReleased testReplacementCannotDeleteFilesStillReferencedByAnOlderLease testDeletingUnusedModelPreservesMeetingFilesOutsideModelRoot testMissingModelCannotProduceAVerifiedLease testCorruptSelectionPointerIsRejectedWithoutReadingAnOutsideModel testCreatesAnActualSQLiteDatabaseWithCurrentVersionTwoSchema testMeetingMetadataSurvivesCloseAndReopen testHistorySortsNewestFirstWithStableUUIDTieBreakAndLimit testConcurrentMeetingWritesAndDuplicateIDCannotOverwriteExistingMetadata testRenamePersistsLiteralTextWithoutChangingIdentityDateOrTranscript testRecordingStateAndCapturedDurationAreDurableAndMissingIDIsAnError testFinalizedTranscriptIsOrderedBySequenceAndSurvivesReopen testReplayingTheSameFinalizedSegmentIsIdempotentAcrossReopen testSegmentIDConflictAndSequenceConflictRollbackTheEntireBatch testUnknownMeetingAndCrossMeetingSegmentsCannotCreateOrphanRecords testSearchIsRestrictedToSelectedMeetingOrderedAndCaseInsensitive testSearchTreatsQuotesAndSQLWildcardsAsLiteralData testDeletingOneMeetingRemovesOnlyItsMetadataAndTranscript testInvalidSegmentValuesAreRejectedWithoutPartialWrites testFutureSchemaIsRejectedWithoutChangingExistingDatabase
          node scripts/verify-test-log.mjs .build/test-output.log testUnloadReleasesReadinessAndReloadStartsAFreshNativeModel testLoadsPinnedActualCPUModelAndReportsNativeVersion testRealSpeechChunksProduceEvolvingPartialsAndCorrectFinal testInputFinishedPreservesLastWordsWithoutEndpointSilence testEndpointResetDoesNotRepeatPriorUtterance testCancellationRejectsOldAudioAndFreshEpochRecognizes testFinishedStreamRejectsMoreAudioAndFinishIsIdempotent testDiscontinuousAndInvalidSamplesDoNotAdvanceStream testDuplicateStartCannotReplaceActiveEpoch testMissingModelFilesFailExplicitlyWithoutReadinessOrFallback
          node scripts/verify-test-log.mjs .build/test-output.log testLargeConvertedBufferIsSplitIntoBoundedNativeChunksWithoutLosingSpeech testActualSpeechStreamsBeforeStopAndFinalTextSurvivesSQLiteReopen testTwoActualUtterancesHaveOrderedGlobalRangesWithoutResetDuplication testMissingVerifiedModelCreatesNoMeetingAndNoRecordingDirectory testActualURLSessionWritesNonemptyServerBytesOnlyToOwnedStaging testHTTPStatusFailureCannotPublishAStagingFile testShortAndOversizedResponsesFailBeforeAFileCanBeInstalled testPlainHTTPAndUnapprovedInitialHostsAreRejectedBeforeNetwork testFinalResponseURLMustRemainHTTPSOnAnApprovedDistributionHost testUnownedOrSymlinkedDestinationCannotBeWritten testExistingDestinationIsNeverOverwritten testCallerCancellationCancelsActualURLSessionTaskAndLeavesNoOutput testRedirectDelegateApprovesOnlyReviewedHTTPSHosts testRealStorageCapacityQueryReturnsNonnegativeCapacityForPersistentDirectory testManualNoteAutosaveMigratesVersionOneAndPersistsExactUnicodeTextAcrossReopen testClearingManualNoteAutosavesAnEmptyValueInsteadOfRestoringOldText testDelayedAutosaveCannotOverwriteANewerDurableManualEdit testManualNoteReplayIsIdempotentButConflictingSameRevisionIsRejected testManualNotesRequireAnOwnedMeetingAndDeleteOnlyWithThatMeeting testHistoryAndSelectedMeetingLoadActualStoredContentWithoutCrossMeetingText testNotesAutosaveReopensFromDurableRevisionAndRenameKeepsTheSameMeeting testSearchAndExportUseOnlySelectionAndDeleteClearsItsVisibleContent testMarkdownExportIncludesOriginalNotesOrderedTimedTranscriptAndModelProvenance testPlainTextExportPreservesUnicodeAndLabelsUnavailableTranscriptHonestly testExportsRejectCrossMeetingNoteOrTranscriptInsteadOfLeakingOtherContent testMarkdownTreatsMeetingMarkupAsTextAndPlainTextRetainsTheOriginal testPlaybackMappingSeeksIntoTheActualSecondCAFWithoutDuplicatingItsFirstFrames testPlaybackUsesHalfOpenSegmentBoundsAndRejectsNegativePositions testPlaybackDoesNotInventAudioOrClampASeekAcrossAnExplicitManifestGap testPlaybackRejectsAnotherMeetingsManifestBeforeOpeningAnyAudio testPlaybackDistinguishesMissingAndUnreadableRealAudioFiles testPlaybackRejectsTraversalSymlinkEscapeAndOverlappingManifestRanges testConvertedAudioReachesBoundedLiveSinkBeforeStopAndFlushesItsTail testRejectedLiveSinkFailsCaptureWithoutASuccessfulManifest testOwnerWaitsForTranscriptFinalizationBeforeAcknowledgingSavedAudio testTranscriptFinalizationFailureCannotPublishRecordingSaved
          node scripts/verify-test-log.mjs .build/test-output.log testConfirmedDeletionRemovesOwnedCAFMetadataNotesAndTranscriptOnly testAnActiveRecordingLeasePreventsDeletionUntilItsCleanupReleasesTheLease testDeletionRejectsAnAliasedMeetingDirectoryWithoutFollowingItsSymlink testDeletionRejectsNestedEscapingLinksAndMismatchedManifestOwnership testUnavailableActualSQLiteLeavesOriginalAudioUntouchedBeforeDeletionStarts testMetadataFailureAfterQuarantineCanBeRecoveredIdempotentlyFromRealDisk testADebouncedEditRetainsItsOriginalMeetingAfterSelectionChanges testFailedLateAutosaveDoesNotReplaceAnotherMeetingsVisibleNotesOrErrorState testOldRenameCannotReplaceAnotherSelectionOrRetargetItsManualNote testOldRenameReadCannotOverwriteANewerEpochOfTheSameMeeting testRecoveryReconcilesActualClosedCAFWithSQLiteWithoutInventingCompletion testMissingAndCorruptSegmentsRemainExplicitGlobalGapsAndCorruptBytesAreQuarantined testAnUncommittedNativeCAFTailIsQuarantinedWithoutGuessingItsGlobalPosition testRecoveryReopensIdempotentlyWithoutDuplicateRowsOrRepeatedTailMoves testRecoveryRejectsTraversalSymlinksAndAnotherMeetingsManifestBeforeAnyMutation testRecoveryCannotTouchAnActiveSessionOrMutateAFinishedMeeting testUnavailableRealSQLitePreventsMovingAnyUncommittedTail testRecoveryJournalSurvivesActualMetadataFailureAfterQuarantineAndFinishesOnReopen testCanonicalPinnedQwenEnvelopeHasFinalAssistantNewline testControlTokenDelimitersAreEscapedAsContentInBothMessageRoles testUnicodeAndOrdinaryMarkupArePreservedWithoutNormalizationOrTruncation testByteLimitCoversTheWholeCanonicalEnvelopeAtItsExactBoundary testUnicodeAndEscapingExpansionAreIncludedInUTF8Budget testInvalidByteLimitsAreRejectedWithoutSilentlyDroppingEvidence testEmptyUserMessageStillHasSeparateCanonicalRoles
          node scripts/verify-test-log.mjs .build/test-output.log testSynchronousReservationBindsTheOriginalMeetingBeforeDebounceAndSelectionChange testRapidReservationsIncreaseRevisionsBeforeAwaitAndReversedCommitsKeepTheLatestEdit testLoadedUnchangedTextAndNilSelectionProduceNoEditOrSQLiteWrite
          node scripts/verify-test-log.mjs .build/test-output.log testActualPinnedHTTPSDownloadInstallsReopensImportsAndRecognizesUnderLease
          node scripts/verify-test-log.mjs .build/test-output.log testHardLinkedOutsideInodeIsRejectedBeforeAnyPolicyAttributeMutation testCAFConstructorRejectsSymlinkedParentWithoutCreatingOutsideSession testOpeningAndReopeningSQLitePreservesUnrelatedSiblingBytesPermissionsAndBackupFlags testRecoveryRejectsAlteredJournalPlansBeforeQuarantiningHealthyAudioOrChangingDuration testExplicitGapUsesCapturedCountAndOneGlobalTimelineForRecoveryAndActualPlayback testRecoveryCountsOnlyFullyDecodableFramesWhenAnActualCAFDataBodyIsTruncated testDirectoryHintCannotRejectTheSameOwnedStagingPath
          node scripts/verify-test-log.mjs .build/test-output.log testCompilerPreservesCallerFieldOrderAndRequestedJSONTypes testFieldsMustBeNonemptyUniqueAndSafeBoundedIdentifiers testEnumValuesAreJSONAndGBNFLiteralsWithoutRuleInjectionOrUnicodeLoss testEmptyScalarEnumFailsButEmptyEvidenceDomainAllowsOnlyAnEmptyArray testGrammarByteBudgetRejectsInvalidLimitsAndNeverTruncatesACompleteGrammar testFieldAndEnumerationCollectionsAreBoundedAndDuplicateValuesRejected
      - name: Exercise queue under Thread Sanitizer
        shell: bash
        run: |
          set -euo pipefail
          swift test --sanitize=thread --filter '(OwnedPCMQueueTests|CaptureCallbackAdmissionTests|MicrophoneCaptureRuntimeTests|LiveActivityControllerTests|RecordingSessionOwnerTests)' 2>&1 | tee .build/queue-tsan.log
          node scripts/verify-test-log.mjs .build/queue-tsan.log testParallelSPSCStressPreservesAcceptedSamplesOrderAndAllDroppedFrames testFinishDrainsQueuedFIFOAndReportsTrailingLossExactlyOnce testConcurrentCloseWaitsForAdmittedWorkAndPublishesItToTheStopper testSequentialAdmissionsOnDifferentThreadsPublishThePreviousCallbacksWork testStopWaitsForAnAdmittedCallbackThenDrainsBeforeDeactivationAndAcknowledgement testMissingEndDoesNotAcknowledgeCleanupAndCanBeRetried testQueuedUpdateCannotReuseResourceAfterEarlierLookupFails testActualOwnedAudioReachesRecordingOnlyWithAllThreeFactsAndProducesRealCAF testHeldActivityEndKeepsCleanupPendingAfterRealAudioFlushAndDeactivation testToggleDuringDomainReservationCancelsTheAdmittedStart testCancellingStartDuringPermissionReleasesTheActivityAndOwner testIntentStopAcknowledgesActualSavedCAFOnlyAfterCleanup testIntentStaleLockScreenStopCannotStopAReplacementAndMatchingOwnerStopWorks testIntentCannotAttributeAReplacementManifestToAnEarlierStopOrToggle testRetiredHandleCallbacksCannotTerminateAReplacementWithTheSameID testEndSettlesAdmittedUpdateAndRejectsLaterUpdatesBeforeAcknowledgement

  local-summary-quality:
    runs-on: macos-15-intel
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify exact source and prepare actual pinned Qwen and native framework
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path('project-config.json').read_text())
          assert config['ci']['costGuardVerified'] is True
          assert config['budget']['maximumAdditionalSpendEUR'] == 0
          assert config['budget']['allowLargerRunners'] is False
          PY
          python3 docs/drafts/T17/prepare_native_summary.py
      - name: Execute all mandatory real-model summary quality tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build
          swift test --filter LocalSummaryRuntimeTests 2>&1 | tee .build/summary-output.log
      - name: Require actual summary cases and preserve quality failures
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-test-log.mjs .build/summary-output.log testActualQwenProducesValidJSONWithCorrectActionSpeakerAndDecision testActualQwenPreservesUnknownBudgetAndReturnsOnlySuppliedEvidenceIDs testNativeSummaryLoadRejectsMissingAndInvalidGGUF testCancelledNativeGenerationDoesNotPublishAndRuntimeCanBeReused

  # Native SDK assertions run independently during test-first core failures.
  # All three jobs remain mandatory for the overall workflow result.
  native-build:
    runs-on: macos-15-intel
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare verified device and simulator summary framework
        shell: bash
        run: |
          set -euo pipefail
          python3 docs/drafts/T17/prepare_native_summary.py --framework-only
      - name: Verify pinned XcodeGen archive and generate project
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p .agent-local/tools
          curl --fail --location --proto '=https' --proto-redir '=https' --retry 2 --retry-delay 4 --max-time 120 \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip \
            -o .agent-local/tools/xcodegen.zip
          test "$(wc -c < .agent-local/tools/xcodegen.zip | tr -d ' ')" = '4278764'
          printf '%s  %s\n' '4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806' '.agent-local/tools/xcodegen.zip' | shasum -a 256 -c -
          unzip -q .agent-local/tools/xcodegen.zip -d .agent-local/tools
          .agent-local/tools/xcodegen/bin/xcodegen --version | tee .agent-local/xcodegen-version.log
          grep -Fx 'Version: 2.46.0' .agent-local/xcodegen-version.log
          .agent-local/tools/xcodegen/bin/xcodegen generate --spec project.yml
      - name: Compile actual device and simulator products without signing
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -quiet -project LocalMinutes.xcodeproj -scheme LocalMinutes -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build/device -clonedSourcePackagesDirPath .agent-local/source-packages CODE_SIGNING_ALLOWED=NO LOCALMINUTES_SOURCE_COMMIT="$GITHUB_SHA" build
          xcodebuild -quiet -project LocalMinutes.xcodeproj -scheme LocalMinutes -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/simulator -clonedSourcePackagesDirPath .agent-local/source-packages CODE_SIGNING_ALLOWED=NO LOCALMINUTES_SOURCE_COMMIT="$GITHUB_SHA" build
      - name: Compile the unchanged physical protection oracle without claiming device execution
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -quiet build-for-testing -project LocalMinutes.xcodeproj -scheme LocalMinutesPhysicalDeviceValidation \
            -configuration Debug -destination 'generic/platform=iOS' -derivedDataPath build/device -clonedSourcePackagesDirPath .agent-local/source-packages \
            CODE_SIGNING_ALLOWED=NO LOCALMINUTES_SOURCE_COMMIT="$GITHUB_SHA"
          printf 'PHYSICAL_FILE_PROTECTION_CASES=7 EXECUTED=0 STATUS=NOT_RUN\n'
      - name: Select an installed iPhone simulator for native control tests
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices available --json > .agent-local/native-simulators.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          inventory = json.loads(Path('.agent-local/native-simulators.json').read_text())
          candidates = [(runtime, device) for runtime, devices in inventory['devices'].items()
                        if '.iOS-' in runtime and int(runtime.rsplit('.iOS-', 1)[1].split('-')[0]) >= 18
                        for device in devices
                        if device.get('isAvailable') and device['name'].startswith('iPhone')]
          assert candidates, 'No installed available iPhone simulator'
          runtime, device = next((item for item in candidates if item[0].endswith('iOS-26-2')),
                                 candidates[0])
          with open(os.environ['GITHUB_ENV'], 'a') as environment:
              environment.write(f"LOCALMINUTES_TEST_SIMULATOR={device['udid']}\n")
          print(json.dumps({'nativeTestRuntime': runtime, 'nativeTestDevice': device}))
          PY
      - name: Execute actual app-hosted recording intent tests
        id: native-app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild test -project LocalMinutes.xcodeproj -scheme LocalMinutes -configuration Debug \
            -destination "platform=iOS Simulator,id=$LOCALMINUTES_TEST_SIMULATOR" -destination-timeout 120 \
            -parallel-testing-enabled NO -collect-test-diagnostics never -only-testing:LocalMinutesAppTests \
            -derivedDataPath build/simulator -clonedSourcePackagesDirPath .agent-local/source-packages -resultBundlePath .agent-local/native-app.xcresult \
            CODE_SIGNING_ALLOWED=NO LOCALMINUTES_SOURCE_COMMIT="$GITHUB_SHA" \
            2>&1 | tee .agent-local/native-app-tests.log
      - name: Require actual native cases and inspect their result bundle
        if: ${{ !cancelled() && (steps.native-app.outcome == 'success' || steps.native-app.outcome == 'failure') }}
        shell: bash
        run: |
          set -euo pipefail
          xcrun xcresulttool get test-results summary --path .agent-local/native-app.xcresult \
            > .agent-local/native-app-summary.json
          xcrun xcresulttool get test-results tests --path .agent-local/native-app.xcresult \
            > .agent-local/native-app-cases.json
          cat .agent-local/native-app-summary.json
          node scripts/verify-test-log.mjs .agent-local/native-app-tests.log \
            testUnavailableRealModelPreventsEveryOSResourceStart \
            testStopDuringHeldPreparationWaitsForExitAndRejectsLateReady \
            testDuplicateStartAndCoalescedStopOwnExactlyOneSetOfResources \
            testActualOwnedAudioReachesRecordingOnlyWithAllThreeFactsAndProducesRealCAF \
            testDisabledOrInactiveActivityCannotStartTheMicrophone \
            testDeniedMicrophoneEndsTheOwnedActivityWithoutRecordingSuccess \
            testHeldActivityEndKeepsCleanupPendingAfterRealAudioFlushAndDeactivation \
            testToggleStartsStopsAndRetriesPendingActivityCleanupWithoutNewCapture \
            testFailedDeactivationKeepsActivityAndExplicitStopRetryDoesNotRestartCapture \
            testUnexpectedActivityLossCannotCompleteAndOldCallbacksCannotStopReplacement \
            testToggleDuringDomainReservationCancelsTheAdmittedStart \
            testCancellingStartDuringPermissionReleasesTheActivityAndOwner \
            testIntentMissingModelReportsBlockedWithoutAnyOSResources \
            testIntentReportsStartingUntilActualFirstBufferThenRecording \
            testIntentDuplicateStartPreservesTheExistingEpochAndResourceSet \
            testIntentDeniedMicrophoneRequiresForegroundAfterActivityCleanup \
            testIntentUnavailableAudioSessionRequiresForegroundAfterActivityCleanup \
            testIntentDisabledOrInitiallyPendingActivityRequiresForegroundWithoutMicrophone \
            testIntentStopAcknowledgesActualSavedCAFOnlyAfterCleanup \
            testIntentIdleStopReturnsIdleWithoutCreatingResources \
            testIntentStaleLockScreenStopCannotStopAReplacementAndMatchingOwnerStopWorks \
            testIntentMissingActivityEndReportsCleanupPendingAndRetryNeverClaimsSavedSuccess \
            testIntentToggleUsesOwnerPhaseAndLaterToggleCanStartANewEpoch \
            testIntentCannotAttributeAReplacementManifestToAnEarlierStopOrToggle \
            testNativeDefaultRootAndIntentsShareApplicationAndMissingModelIsBlocked \
            testNativeStartUsesInjectedRealOwnerAndWaitsForActualBufferReadiness \
            testNativeGenericStopWaitsForActualSavedCAFAndAllResourceCleanup \
            testNativeToggleStopsExistingOwnerAndLaterInvocationStartsNewEpoch \
            testNativeActivityStopParameterRejectsMalformedAndStaleIDsBeforeMatchingStop \
            testNativeStopKeepsFailedEndPendingAndExplicitRetryPreservesFailure \
            testNativeForegroundRequestFailureNeverChangesDeniedCaptureIntoSuccess \
            testNativeSDKConformancesAndThreeDiscoverableShortcutsArePresent \
            testNativeOverlappingTogglesShareOneCleanupAndALaterCallCanStart \
            testNativeCancelledStartAndToggleCannotActivateAfterHeldModelPreparation \
            testNativeSecondToggleCancelsHeldPreparationInsteadOfCoalescingAStart \
            testActivityTimerStartsOnlyAtRecordingAndDoesNotResetOnUpdates \
            testActivityTerminalTimerRemainsFixedAndCannotEndBeforeItsStart \
            testFailedPreparationHasNoRecordingTimerAndDefaultPayloadContainsNoMeetingText \
            testNativeScopedActivityStopDeclaresBackgroundExecution
          node scripts/verify-test-log.mjs .agent-local/native-app-tests.log testSimulatorProtectionCapabilityIsReportedWithoutPhysicalVerification testDefaultServicesUseExcludedPrivatePersistentRoots testVerifiedModelCopyAndAtomicPointerPreserveSourceBytesAndPermissions testSQLiteSidecarRecreationAndCAFCheckpointRemainExcludedPrivateAndReadable testSymlinkPreflightAndAtomicReplacementPreserveOutsideFilesAndCleanTemporaryFiles
          node scripts/verify-test-log.mjs .agent-local/native-app-tests.log testOwnerWaitsForTranscriptFinalizationBeforeAcknowledgingSavedAudio testTranscriptFinalizationFailureCannotPublishRecordingSaved testDelayedPlaybackCannotActivateAfterStartReservationBeforeDomainPhaseChanges testDelayedPlaybackCannotActivateAfterToggleReservationBeforeDomainPhaseChanges testDelayedPlaybackIsBlockedWhileRealOwnerPreparationIsHeld testDelayedPlaybackCannotReconfigureOrDeactivateAnActiveRealCapture testRecordingClosesAdmittedPlaybackBeforeAnyCaptureActivation testFailedPlaybackDeactivationPreventsCaptureAndRemainsExplicitlyRetryable testStoppingBlocksPlaybackUntilActualCAFFlushAndActivityEndSettle testFailedCaptureDeactivationBlocksPlaybackUntilExplicitCaptureCleanupRetry
          node scripts/verify-test-log.mjs .agent-local/native-app-tests.log testGlobalStopRevokesAPlayAwaitingItsSnapshotAndALaterPlayCanStart testCancelledPendingPlayCannotActivateAndALaterPlayCanStart testScopedOldRequestCleanupCannotStopAReplacementPlayer
      - name: Execute actual recording-control UI test
        id: native-ui
        if: ${{ !cancelled() && (steps.native-app.outcome == 'success' || steps.native-app.outcome == 'failure') }}
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild test -project LocalMinutes.xcodeproj -scheme LocalMinutes -configuration Debug \
            -destination "platform=iOS Simulator,id=$LOCALMINUTES_TEST_SIMULATOR" -destination-timeout 120 \
            -parallel-testing-enabled NO -collect-test-diagnostics never -only-testing:LocalMinutesUITests \
            -derivedDataPath build/simulator -clonedSourcePackagesDirPath .agent-local/source-packages -resultBundlePath .agent-local/native-ui.xcresult \
            CODE_SIGNING_ALLOWED=NO LOCALMINUTES_SOURCE_COMMIT="$GITHUB_SHA" \
            2>&1 | tee .agent-local/native-ui-tests.log
      - name: Require actual control UI assertion and inspect its result bundle
        if: ${{ !cancelled() && (steps.native-ui.outcome == 'success' || steps.native-ui.outcome == 'failure') }}
        shell: bash
        run: |
          set -euo pipefail
          xcrun xcresulttool get test-results summary --path .agent-local/native-ui.xcresult \
            > .agent-local/native-ui-summary.json
          cat .agent-local/native-ui-summary.json
          node scripts/verify-test-log.mjs .agent-local/native-ui-tests.log \
            testStartExplainsMissingSpeechModelWithoutClaimingRecording \
            testSharedActivityStopControlDispatchesItsExactSessionToTheApplicationOwner \
            testSharedActivityTerminalTimerIsFixedAndStopIsDisabled
      - name: Inspect compiled plists and Mach-O products
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/native-tests/device-build.test.mjs
      - name: Test real unsigned archive packaging
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/native-tests/package.test.mjs
      - name: Create and verify ephemeral unsigned package without uploading
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import { createUnsignedIPA } from './scripts/package-ios.mjs';
          import { readFileSync } from 'node:fs';
          const result = await createUnsignedIPA({
            appPath: 'build/device/Build/Products/Release-iphoneos/LocalMinutes.app',
            outputDirectory: 'build/package', sourceCommit: process.env.GITHUB_SHA
          });
          console.log(readFileSync(result.manifestPath, 'utf8'));
          console.log(readFileSync(result.checksumPath, 'utf8'));
          JS
