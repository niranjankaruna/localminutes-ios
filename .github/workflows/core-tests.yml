            native_cases=(-only-testing:LocalMinutesUITests/ModelBrowserAccessibilityUITests -only-testing:LocalMinutesUITests/RequiredScreenInformationUITests -only-testing:LocalMinutesUITests/LibraryProductUITests)
          elif [[ "$NATIVE_TEST_CLASS" == MVP3Contracts || "$NATIVE_TEST_CLASS" == NativeSummarySelectionStartupTests ]]; then
            native_cases=(-only-testing:LocalMinutesAppTests/NativeRootPrivacyTests -only-testing:LocalMinutesAppTests/NativeOpenLatestMeetingIntentTests -only-testing:LocalMinutesAppTests/NativeRecordingProgressTests -only-testing:LocalMinutesAppTests/NativeMeetingCitationNavigationTests -only-testing:LocalMinutesAppTests/NativeAppBuildIdentityTests -only-testing:LocalMinutesAppTests/RecordingSessionOwnerTests/testNativeSDKConformancesAndThreeDiscoverableShortcutsArePresent)
            if [ "$NATIVE_TEST_CLASS" = NativeSummarySelectionStartupTests ]; then
              native_cases+=(-only-testing:LocalMinutesAppTests/NativeSummarySelectionStartupTests)
            fi
          elif [ "$NATIVE_TEST_CLASS" = MVP1Services ]; then
            native_cases=(-only-testing:LocalMinutesAppTests/NativeAppMetricsTests -only-testing:LocalMinutesAppTests/NativeModelResourceTests)
          elif [ "$NATIVE_TEST_CLASS" = NativeMVP2LibraryTests ]; then
            native_cases=(-only-testing:LocalMinutesAppTests/NativeMVP2LibraryTests -only-testing:LocalMinutesAppTests/NativeMVP2AdmissionRaceTests)
          else
            native_cases=("-only-testing:LocalMinutesAppTests/$NATIVE_TEST_CLASS")
          fi
          xcodebuild test -project LocalMinutes.xcodeproj -scheme "$native_scheme" -configuration Debug \
            -destination "platform=iOS Simulator,id=$LOCALMINUTES_TEST_SIMULATOR" -destination-timeout 120 \
            -parallel-testing-enabled NO -collect-test-diagnostics never "${native_cases[@]}" \
            -derivedDataPath build/focused-app -clonedSourcePackagesDirPath .agent-local/source-packages \
            -resultBundlePath .agent-local/focused-app-metrics.xcresult \
            CODE_SIGNING_ALLOWED=NO LOCALMINUTES_SOURCE_COMMIT="$GITHUB_SHA" 2>&1 | tee .agent-local/focused-app-metrics.log
      - name: Require the focused native assertions
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -d .agent-local/focused-app-metrics.xcresult ]; then
            if xcrun xcresulttool get test-results summary --path .agent-local/focused-app-metrics.xcresult > .agent-local/focused-native-summary.json; then
