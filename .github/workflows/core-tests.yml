name: LocalMinutes build or validation

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Build the MVP package, or explicitly run the saved validation jobs
        required: true
        type: choice
        default: mvp
        options: [mvp, features, package, validation, candidate, candidate-summary, candidate-summary-parts, model-catalog, model-integration, model-repair, model-delivery, mvp2-red, mvp2, mvp2-integration, mvp2-parakeet, mvp3, mvp3-integration, mvp3-startup, mvp3-functional, mvp4-storage, mvp4-final]
      sourceCommit:
        description: Reviewed app source for the MVP package
        required: true
        default: db1b8d51c5ff72bf1d8abfd13f99a1da06a11e04
      summaryResume:
        description: Recheck actual summary resume when its implementation changed
        type: boolean
        required: true
        default: true
      packageMVP2:
        description: Also compile and retain the MVP2 IPA at this exact source
        type: boolean
        required: true
        default: false
      buildASROnly:
        description: Build and retain the pinned ASR-only native framework candidate
        type: boolean
        required: true
        default: false
      proveLibraryBootstrap:
        description: Capture the recorded old nil-fixture failure once, separately from current UI gates
        type: boolean
        required: true
        default: false
      retainMVP3:
        description: Retain the passing native MVP3 package in an existing unpublished owner draft
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: localminutes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  current-phi-integration:
    if: ${{ inputs.mode == 'mvp3-integration' }}
    name: Current Phi (${{ matrix.flow }})
    runs-on: macos-15-intel
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        flow: [selected-service, representative]
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      PHI_FLOW: ${{ matrix.flow }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare current pinned Phi and native libraries
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 scripts/prepare_asr_only.py --platform macos
          python3 docs/drafts/T17/prepare_native_summary.py --framework-only
          swift build --build-tests
          python3 docs/drafts/T17/prepare_phi3_candidate.py
      - name: Evaluate real selected service and multi-map refusal quality
        shell: bash
        run: |
          set -euo pipefail
          export LOCALMINUTES_PHI_MODEL_PATH="$LOCALMINUTES_CANDIDATE_MODEL_PATH"
          mkdir -p .build
          if [ "$PHI_FLOW" = selected-service ]; then
            swift test --skip-build --filter 'IntelligenceTests[.]ActualSelectedModelIntelligenceTests' 2>&1 | tee .build/current-phi-integration.log
          else
            swift test --skip-build --filter 'QuestionAnsweringTests[.]Phi3CandidateComparisonTests/testActualPinnedPhi3RepresentativeMultiMapMergeAndUnknownDeadlineRefusal' 2>&1 | tee .build/current-phi-integration.log
          fi
      - name: Require the selected actual model evaluation without skips
        if: always()
        shell: bash
        run: |
          if [ "$PHI_FLOW" = selected-service ]; then
            node scripts/verify-test-log.mjs .build/current-phi-integration.log testActualSelectedPhiDefaultLoaderSavesSummaryAndGuideAnswerWithOriginalsPreserved
          else
            node scripts/verify-test-log.mjs .build/current-phi-integration.log testActualPinnedPhi3RepresentativeMultiMapMergeAndUnknownDeadlineRefusal
          fi

  library-ui-harness-red:
    if: ${{ inputs.mode == 'mvp3-integration' && inputs.proveLibraryBootstrap }}
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      BASELINE_SOURCE: 8edff56a96f051587d727812239937ccba51b9a5
    steps:
      - name: Check out the recorded nil-fixture baseline only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 8edff56a96f051587d727812239937ccba51b9a5
          persist-credentials: false
      - name: Prepare original harness and an available simulator
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASELINE_SOURCE"
          python3 docs/drafts/T17/prepare_native_summary.py --framework-only
          mkdir -p .agent-local/tools
          curl --fail --location --proto '=https' --proto-redir '=https' --retry 2 --retry-delay 4 --max-time 120 https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip -o .agent-local/tools/xcodegen.zip
          test "$(wc -c < .agent-local/tools/xcodegen.zip | tr -d ' ')" = '4278764'
          printf '%s  %s\n' '4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806' '.agent-local/tools/xcodegen.zip' | shasum -a 256 -c -
          unzip -q .agent-local/tools/xcodegen.zip -d .agent-local/tools
          .agent-local/tools/xcodegen/bin/xcodegen generate --spec project.yml
          xcrun simctl list devices available --json > .agent-local/baseline-simulators.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          inventory = json.loads(Path('.agent-local/baseline-simulators.json').read_text())
          candidates = [(runtime, device) for runtime, devices in inventory['devices'].items()
              if '.iOS-' in runtime and int(runtime.rsplit('.iOS-', 1)[1].split('-')[0]) >= 18
              for device in devices if device.get('isAvailable') and device['name'].startswith('iPhone')]
          assert candidates
          runtime, device = next((x for x in candidates if x[0].endswith('iOS-26-2')), candidates[0])
          with open(os.environ['GITHUB_ENV'], 'a') as environment:
              environment.write('BASELINE_SIMULATOR=' + device['udid'] + '\n')
          print(json.dumps({'baselineSource': os.environ['BASELINE_SOURCE'], 'runtime': runtime, 'device': device['name']}))
          PY
      - name: Observe original nil-fixture failure without hiding RED
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild test -project LocalMinutes.xcodeproj -scheme LocalMinutes -configuration Debug \
            -destination "platform=iOS Simulator,id=$BASELINE_SIMULATOR" -destination-timeout 120 \
            -parallel-testing-enabled NO -collect-test-diagnostics never \
            -only-testing:LocalMinutesUITests/LibraryProductUITests \
            -derivedDataPath build/library-baseline -clonedSourcePackagesDirPath .agent-local/source-packages \
            -resultBundlePath .agent-local/library-baseline.xcresult \
            CODE_SIGNING_ALLOWED=NO LOCALMINUTES_SOURCE_COMMIT="$BASELINE_SOURCE" \
            2>&1 | tee .agent-local/library-baseline.log
      - name: Report actual harness-only baseline counts
        if: always()
        shell: bash
        run: |
          if [ -d .agent-local/library-baseline.xcresult ]; then
            xcrun xcresulttool get test-results summary --path .agent-local/library-baseline.xcresult
          fi
          echo 'This baseline is harness-only evidence at the explicitly recorded old SHA, not current product GREEN.'

  asr-only-build:
    if: ${{ inputs.mode == 'mvp3' && inputs.buildASROnly }}
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify exact source and standard free-runner guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import json
          from pathlib import Path
          c = json.loads(Path('project-config.json').read_text())
          assert c['github']['visibility'] == 'public' and c['github']['publicationApproved']
          assert c['ci']['costGuardVerified'] and c['budget']['maximumAdditionalSpendEUR'] == 0
          assert not c['budget']['allowLargerRunners']
          PY
      - name: Build same-revision CPU ASR libraries without speech synthesis
        run: python3 scripts/prepare_asr_only.py --platform all --jobs 3
      - name: Package actual framework and reproducibility receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, zipfile
          root = pathlib.Path('Vendor/SherpaASROnly/Artifacts')
          framework = root / 'SherpaOnnxC.xcframework'
          receipt = root / 'SherpaOnnxC.receipt.json'
          assert framework.is_dir() and receipt.is_file()
          source = os.environ['GITHUB_SHA']
          output = pathlib.Path('.agent-local/asr-only-delivery')
          output.mkdir()
          archive = output / f'NativeSherpaASR-1.13.8-{source}.zip'
          with zipfile.ZipFile(archive, 'w', zipfile.ZIP_DEFLATED) as z:
              for path in sorted(root.rglob('*')):
                  assert not path.is_symlink()
                  if path.is_file():
                      z.write(path, path.relative_to(root).as_posix())
          with zipfile.ZipFile(archive) as z:
              assert z.testzip() is None
          digest = hashlib.file_digest(archive.open('rb'), 'sha256').hexdigest()
          manifest = {'schemaVersion': 1, 'sourceCommit': source,
              'sherpaRevision': '11afbd009a7f8c08f4bcf2fc1b265d0df4670fbf',
              'artifact': archive.name, 'sha256': digest, 'sizeBytes': archive.stat().st_size,
              'nativeLinkAndInference': 'PENDING', 'published': False}
          (output / 'native-asr-build.json').write_text(json.dumps(manifest, indent=2) + '\n')
          print(json.dumps(manifest))
          PY
      - name: Retain in existing unpublished owner draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="native-asr-11afbd0-${GITHUB_SHA:0:12}"
          gh release view "$tag" --json isDraft,targetCommitish > .agent-local/asr-only-draft.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          release = json.loads(Path('.agent-local/asr-only-draft.json').read_text())
          assert release['isDraft'] is True and release['targetCommitish'] == os.environ['GITHUB_SHA']
          PY
          gh release upload "$tag" .agent-local/asr-only-delivery/*

  mvp2-portable:
    if: ${{ inputs.mode == 'mvp2-red' || inputs.mode == 'mvp2' || inputs.mode == 'mvp2-integration' || inputs.mode == 'mvp2-parakeet' }}
    runs-on: macos-15-intel
    timeout-minutes: 12
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify free-runner guard and prepare pinned framework linkage only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import json
          from pathlib import Path
          c = json.loads(Path('project-config.json').read_text())
          assert c['ci']['costGuardVerified'] is True
          assert c['budget']['maximumAdditionalSpendEUR'] == 0
          assert c['budget']['allowLargerRunners'] is False
          assert c['github']['visibility'] == 'public'
          PY
          python3 scripts/prepare_asr_only.py --platform macos
          python3 docs/drafts/T17/prepare_native_summary.py --framework-only
      - name: Run the MVP2 contracts or their focused module regressions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build
          if [ "${{ inputs.mode }}" = mvp2-red ]; then
            filter='CoreTests[.]MeetingArchiveTests|ModelTests[.]DownloadResumeTests|PersistenceTests[.]SQLiteSnapshotTests|SummaryTests[.]SummaryResumePipelineTests'
          elif [[ "${{ inputs.mode }}" == mvp2-integration || "${{ inputs.mode }}" == mvp2-parakeet ]]; then
            filter='CoreTests[.]|ModelTests[.]|PersistenceTests[.]|SummaryTests[.](SummaryResumePipelineTests|SummaryPipelineTests|GroundedSummaryTests|NestedStructuredSchemaTests|StructuredJSONSchemaTests)|IntelligenceTests[.]SummaryResumeIntelligenceTests|MeetingLibraryTests[.](LibraryArchiveCoordinatorTests|MeetingDeletionArtifactTests)'
          else
            filter='CoreTests[.]|ModelTests[.]|PersistenceTests[.]|SummaryTests[.](SummaryResumePipelineTests|SummaryPipelineTests|GroundedSummaryTests|NestedStructuredSchemaTests|StructuredJSONSchemaTests)'
          fi
          swift test --filter "$filter" 2>&1 | tee .build/mvp2-portable.log
      - name: Require genuine discovered MVP2 assertions
        if: always()
        shell: bash
        run: |
          node scripts/verify-test-log.mjs .build/mvp2-portable.log \
            testCancelledPipelinePersistsValidatedPrefixAndReopenedPipelineGeneratesOnlyMissingMaps \
            testNativeSnapshotIncludesCommittedWALSourcesNotesGeneratedEditsAndFTSAsStandaloneDatabase
          if [ "${{ inputs.mode }}" = mvp2-parakeet ]; then
            node scripts/verify-test-log.mjs .build/mvp2-portable.log \
              testOriginalNvidiaNeMoModelExplainsNativeConversionAndSuggestsExactCoreMLFamily \
              testCompletePinnedV2CoreMLFilesHaveDedicatedAdapterAndHonestEstimatedPhoneRequirements \
              testMissingChangedUnreviewedOrGatedCoreMLAssetsCannotAdvertiseReadyAndONNXCannotUseNativeProfile \
              testNestedAssetImportReopensInventoriesAndLeasesWithoutCollapsingRepeatedRolesOrChangingSources \
              testNestedDownloadCreatesOwnedParentsVerifiesEveryAssetAndPreservesCurrentAfterLaterFailure \
              testFilesFolderSelectionBalancesOneSecurityScopeAndRefusesDeniedOrAliasedRootsWithoutSourceChanges \
              testExactNativeTDTIdentityAndMeasuredCountersRoundTripWithoutInventedComputeClaims \
              testNativeRuntimeIdentityCannotAuthorizeUnmeasuredGPUOrPrivatePayloadFields \
              testRemovingModelPurgesInterruptedProgressWithoutErasingAnotherPinAndRefusesCacheLinks \
              testFilesImportWithoutDirectoryURLHintLeavesNoOwnedSourceCopiesAfterSuccessfulInstall
          fi

  mvp2-recovery:
    if: ${{ inputs.mode == 'mvp2-red' || inputs.mode == 'mvp2' || inputs.mode == 'mvp2-integration' || inputs.mode == 'mvp2-parakeet' }}
    runs-on: macos-15-intel
    timeout-minutes: 12
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare only the reviewed actual speech fixtures
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 scripts/prepare_asr_only.py --platform macos
          python3 docs/drafts/T17/prepare_native_summary.py --framework-only
          python3 docs/drafts/T10/prepare_whisper_fixture.py
          python3 docs/drafts/T10/prepare_native_fixture.py
          printf 'LOCALMINUTES_ASR_MODEL_DIRECTORY=%s/.agent-local/asr-evaluation/native-fixtures/model\n' "$PWD" >> "$GITHUB_ENV"
          printf 'LOCALMINUTES_ASR_FIXTURE_PATH=%s/.agent-local/asr-evaluation/native-fixtures/6930-75918-0000.flac\n' "$PWD" >> "$GITHUB_ENV"
      - name: Exercise captured-model recovery and journal integrity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build
          if [ "${{ inputs.mode }}" = mvp2-red ]; then
            filter='ASRTests[.](TranscriptionReplayCheckpointIntegrityTests|SelectedModelRecoveryTests)'
          else
            filter='ASRTests[.](TranscriptionReplayCheckpointIntegrityTests|SelectedModelRecoveryTests|RecoveredTranscriptionReplayTests)'
          fi
          swift test --filter "$filter" 2>&1 | tee .build/mvp2-recovery.log
      - name: Require actual model-backed recovery assertions
        if: always()
        run: node scripts/verify-test-log.mjs .build/mvp2-recovery.log testCursorOnlyJumpToTimelineEndCannotSkipRemainingActualSpeechAfterReopen testActualWhisperPreparationPersistsCoherentImmutableMeetingPinBeforeFirstAudioFrame

  focused-portable:
    if: ${{ inputs.mode == 'candidate-summary-parts' || inputs.mode == 'model-catalog' || inputs.mode == 'model-integration' || inputs.mode == 'model-repair' || inputs.mode == 'model-delivery' || inputs.mode == 'mvp3' || inputs.mode == 'mvp3-startup' || inputs.mode == 'mvp3-functional' || inputs.mode == 'mvp4-storage' || inputs.mode == 'mvp4-final' }}
    runs-on: macos-15-intel
    timeout-minutes: 12
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare pinned native linkage
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/prepare_asr_only.py --platform macos
          python3 docs/drafts/T17/prepare_native_summary.py --framework-only
          if [ "${{ inputs.mode }}" = model-catalog ]; then
            python3 docs/drafts/T10/prepare_whisper_fixture.py
          fi
      - name: Exercise only pending generated-save cancellation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p .build
          if [ "${{ inputs.mode }}" = mvp4-final ]; then
            swift test --filter 'MeetingLibraryTests[.]HistoryPaginationTests' 2>&1 | tee .build/focused-portable.log
          elif [ "${{ inputs.mode }}" = mvp4-storage ]; then
            swift test --filter 'CoreTests[.]StorageAuditTests' 2>&1 | tee .build/focused-portable.log
          elif [[ "${{ inputs.mode }}" == mvp3 || "${{ inputs.mode }}" == mvp3-startup || "${{ inputs.mode }}" == mvp3-functional ]]; then
            swift test --filter 'CoreTests[.](RecordingProgressPresenterTests|TranscriptionMetricsTests)|PersistenceTests[.]MeetingContentStatusTests|SummaryTests[.](SummaryPipelineTests|StructuredJSONSchemaTests)' 2>&1 | tee .build/focused-portable.log
          elif [[ "${{ inputs.mode }}" == model-integration || "${{ inputs.mode }}" == model-repair || "${{ inputs.mode }}" == model-delivery ]]; then
            swift test --filter 'ModelTests[.](HuggingFaceRepositoryTests|ModelSelectionTests|ModelDeviceResourceReaderTests|ModelInstallationIdentityTests|ModelRuntimeCompatibilityTests)|CoreTests[.]TranscriptionMetricsTests|PersistenceTests[.]SummaryCheckpointStoreTests|SummaryTests[.](SummaryPipelineTests|GroundedSummaryTests|NestedStructuredSchemaTests|StructuredJSONSchemaTests)' 2>&1 | tee .build/focused-portable.log
          elif [ "${{ inputs.mode }}" = model-catalog ]; then
            swift test --filter 'ModelTests[.](HuggingFaceRepositoryTests|ModelSelectionTests)|ASRTests[.]WhisperSpeechRecognizerTests|SummaryTests[.](SummaryPipelineTests|GroundedSummaryTests|NestedStructuredSchemaTests|StructuredJSONSchemaTests)' 2>&1 | tee .build/focused-portable.log
          else
            swift test --filter 'IntelligenceSessionTests/testCancellationBeforeBlockedSQLiteCommitSavesNothingAndPreservesOriginalsAndModel' 2>&1 | tee .build/focused-portable.log
          fi
      - name: Require actual focused assertions
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.mode }}" = mvp4-final ]; then
            node scripts/verify-test-log.mjs .build/focused-portable.log \
              testActualSQLiteHistoryLoadsBeyondFirstHundredWithoutDuplicatesOrOrderLoss \
              testTitleSearchQueriesOlderSQLiteRowsAndTreatsWildcardAndQuoteCharactersLiterally \
              testHistoryAndDetailExposeLoadingUntilTheirActualSQLiteReadProjectionSettles \
              testClosedSQLiteHistoryAndDetailFailuresClearLoadingAndRetainHonestErrors \
              testTranscriptSearchLoadsAllFiftyFiveMatchesInOrderWithoutAnotherMeetingsSource
          elif [ "${{ inputs.mode }}" = mvp4-storage ]; then
            node scripts/verify-test-log.mjs .build/focused-portable.log \
              testActualOwnedTreeReportsFixedRolesCountsAndOSMetadataWithoutRewritingFiles \
              testActualAncestorBackupExclusionIsComparedWithIndependentFoundationReads \
              testActualEnvironmentCannotBeReportedAsPhysicalIOSByDesktopOrSimulator \
              testSerializedReportContainsOnlyFixedCategoriesAndCountsNeverPathsNamesOrContent \
              testSmallBoundAndInvalidBoundsRemainExplicitInsteadOfClaimingACompleteAudit \
              testMissingRootIsUnreadableAndNonFileRootIsUnsafeWithoutFabricatingEmptySuccess \
              testSymlinkRootAndNestedEscapeAreRejectedWithoutReadingOrModifyingOutsideFiles
          elif [[ "${{ inputs.mode }}" == mvp3 || "${{ inputs.mode }}" == mvp3-startup || "${{ inputs.mode }}" == mvp3-functional ]]; then
            node scripts/verify-test-log.mjs .build/focused-portable.log testFirstPCMElapsedSurvivesPresenterRecreationAndDoesNotUseTranscribedDuration testMeasuredBacklogWarnsStrictlyAboveFiveSecondsAndReportsRealCatchUp
            node scripts/verify-test-log.mjs .build/focused-portable.log testActualSQLiteStatusDistinguishesEachMeetingsTranscriptAndSummaryAndRemainsUnknownWhenUnreadable
            node scripts/verify-test-log.mjs .build/focused-portable.log testMultiSentenceSourceGrammarPermitsExactSentenceChoicesWithoutForcingParagraphOwnership
            node scripts/verify-test-log.mjs .build/focused-portable.log \
              testMapGrammarBindsEachSourceRangeQuoteAndClaimAsOneCorrelatedChoice \
              testObjectAlternativesRetainEveryCorrelatedBranchWithoutWideningFields \
              testRepeatedCorrelatedChoiceDomainsFitTheExistingGrammarBudgetWithoutLosingBranches
          elif [[ "${{ inputs.mode }}" == model-integration || "${{ inputs.mode }}" == model-repair || "${{ inputs.mode }}" == model-delivery ]]; then
            node scripts/verify-test-log.mjs .build/focused-portable.log testInstalledInventoryListsBothAlternativesDeterministicallyWithoutChangingEquipment
          elif [ "${{ inputs.mode }}" = model-catalog ]; then
            node scripts/verify-test-log.mjs .build/focused-portable.log testWhisperLoadsActualPinnedModelOnCPUOutsideMainThread
          else
            node scripts/verify-test-log.mjs .build/focused-portable.log testCancellationBeforeBlockedSQLiteCommitSavesNothingAndPreservesOriginalsAndModel
          fi
      - name: Verify focused package hygiene regressions
        run: node --test scripts/tests/whisper-package-policy.test.mjs scripts/tests/package-audit.test.mjs scripts/tests/ios-artifacts.test.mjs

  focused-app-metrics:
    if: ${{ inputs.mode == 'candidate-summary-parts' || inputs.mode == 'model-catalog' || inputs.mode == 'model-integration' || inputs.mode == 'model-repair' || inputs.mode == 'model-delivery' || inputs.mode == 'mvp2-integration' || inputs.mode == 'mvp2-parakeet' || inputs.mode == 'mvp3' || inputs.mode == 'mvp3-startup' || inputs.mode == 'mvp4-storage' || inputs.mode == 'mvp4-final' }}
    name: Native focused (${{ matrix.testclass }})
    runs-on: ${{ (inputs.mode == 'mvp2-parakeet' || inputs.mode == 'mvp3' || inputs.mode == 'mvp3-startup' || inputs.mode == 'mvp4-storage' || inputs.mode == 'mvp4-final') && 'macos-15' || 'macos-15-intel' }}
    timeout-minutes: ${{ (inputs.mode == 'mvp3' || inputs.mode == 'mvp3-startup' || inputs.mode == 'mvp4-storage' || inputs.mode == 'mvp4-final') && 45 || (inputs.mode == 'model-delivery' || inputs.mode == 'mvp2-integration' || inputs.mode == 'mvp2-parakeet') && 18 || 15 }}
    strategy:
      fail-fast: false
      matrix:
        testclass: ${{ fromJSON(inputs.mode == 'mvp4-final' && '["MVP4FinalContracts","MVP4FinalUI"]' || inputs.mode == 'mvp4-storage' && '["NativeStoragePrivacyReportTests","MVP4StorageUI"]' || inputs.mode == 'mvp3-startup' && '["NativeSummarySelectionStartupTests","MVP3AccessibilityUI"]' || inputs.mode == 'mvp3' && '["MVP3Contracts","MVP3AccessibilityUI"]' || (inputs.mode == 'mvp2-integration' || inputs.mode == 'mvp2-parakeet') && '["NativeMVP2LibraryTests"]' || inputs.mode == 'model-delivery' && '["MVP1Services"]' || (inputs.mode == 'model-integration' || inputs.mode == 'model-repair') && '["NativeAppMetricsTests","NativeModelResourceTests"]' || '["NativeAppMetricsTests"]') }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      NATIVE_TEST_CLASS: ${{ matrix.testclass }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify source and prepare pinned project tools
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import json
          from pathlib import Path
          c = json.loads(Path('project-config.json').read_text())
          assert c['ci']['costGuardVerified'] is True
          assert c['budget']['maximumAdditionalSpendEUR'] == 0
          assert c['budget']['allowLargerRunners'] is False
          assert c['github']['visibility'] == 'public'
          PY
          python3 scripts/prepare_asr_only.py --platform ios
          python3 docs/drafts/T17/prepare_native_summary.py --framework-only
          mkdir -p .agent-local/tools
          curl --fail --location --proto '=https' --proto-redir '=https' --retry 2 --retry-delay 4 --max-time 120 https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip -o .agent-local/tools/xcodegen.zip
          test "$(wc -c < .agent-local/tools/xcodegen.zip | tr -d ' ')" = '4278764'
          printf '%s  %s\n' '4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806' '.agent-local/tools/xcodegen.zip' | shasum -a 256 -c -
          unzip -q .agent-local/tools/xcodegen.zip -d .agent-local/tools
          .agent-local/tools/xcodegen/bin/xcodegen generate --spec project.yml
          xcrun simctl list devices available --json > .agent-local/focused-simulators.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          inventory = json.loads(Path('.agent-local/focused-simulators.json').read_text())
          candidates = [(runtime, device) for runtime, devices in inventory['devices'].items()
                        if '.iOS-' in runtime and int(runtime.rsplit('.iOS-', 1)[1].split('-')[0]) >= 18
                        for device in devices if device.get('isAvailable') and device['name'].startswith('iPhone')]
          assert candidates
          runtime, device = next((item for item in candidates if item[0].endswith('iOS-26-2')), candidates[0])
          with open(os.environ['GITHUB_ENV'], 'a') as environment:
              environment.write(f"LOCALMINUTES_TEST_SIMULATOR={device['udid']}\n")
          print(json.dumps({'runtime': runtime, 'device': device['name']}))
          PY
      - name: Boot the simulator while the focused app builds
        shell: bash
        run: |
          xcrun simctl boot "$LOCALMINUTES_TEST_SIMULATOR" || true
          xcrun simctl bootstatus "$LOCALMINUTES_TEST_SIMULATOR" -b > .agent-local/focused-simulator-boot.log 2>&1 &
      - name: Execute only the selected default-app service contracts
        shell: bash
        run: |
          set -euo pipefail
          native_scheme=LocalMinutesFocusedValidation
          if [ "$NATIVE_TEST_CLASS" = MVP4FinalUI ]; then
            native_scheme=LocalMinutes
            if [ "${{ inputs.packageMVP2 }}" = true ]; then
              native_cases=(-only-testing:LocalMinutesUITests)
            else
              native_cases=(-only-testing:LocalMinutesUITests/HistoryPaginationUITests -only-testing:LocalMinutesUITests/AnswerEditingUITests)
            fi
          elif [ "$NATIVE_TEST_CLASS" = MVP4FinalContracts ]; then
            if [ "${{ inputs.packageMVP2 }}" = true ]; then
              native_cases=(-only-testing:LocalMinutesAppTests)
            else
              native_cases=(-only-testing:LocalMinutesAppTests/NativeIntelligenceMemoryPressureTests -only-testing:LocalMinutesAppTests/NativeAnswerEditingTests)
            fi
          elif [ "$NATIVE_TEST_CLASS" = MVP4StorageUI ]; then
            native_scheme=LocalMinutes
            native_cases=(-only-testing:LocalMinutesUITests/StoragePrivacyReportUITests -only-testing:LocalMinutesUITests/ModelBrowserAccessibilityUITests)
          elif [ "$NATIVE_TEST_CLASS" = NativeStoragePrivacyReportTests ]; then
            native_cases=(-only-testing:LocalMinutesAppTests/NativeStoragePrivacyReportTests -only-testing:LocalMinutesAppTests/NativeStoragePolicyTests -only-testing:LocalMinutesAppTests/NativeMVP2AdmissionRaceTests)
          elif [ "$NATIVE_TEST_CLASS" = MVP3AccessibilityUI ]; then
