  local-summary-quality:
    if: ${{ inputs.mode == 'validation' }}
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify exact source and prepare actual pinned Qwen and native framework
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path('project-config.json').read_text())
          assert config['ci']['costGuardVerified'] is True
          assert config['budget']['maximumAdditionalSpendEUR'] == 0
          assert config['budget']['allowLargerRunners'] is False
          PY
          python3 scripts/prepare_asr_only.py --platform macos
          python3 docs/drafts/T17/prepare_native_summary.py
      - name: Execute all mandatory real-model summary quality tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build
          swift test --filter '(LocalSummaryRuntimeTests|ActualPromptTokenizationTests|ActualSummaryPipelineTests|ActualQwenMeetingQuestionTests|ActualIntelligenceCompositionTests)' 2>&1 | tee .build/summary-output.log
      - name: Require actual summary cases and preserve quality failures
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-test-log.mjs .build/summary-output.log testActualQwenProducesValidJSONWithCorrectActionSpeakerAndDecision testActualQwenPreservesUnknownBudgetAndReturnsOnlySuppliedEvidenceIDs testNativeSummaryLoadRejectsMissingAndInvalidGGUF testCancelledNativeGenerationDoesNotPublishAndRuntimeCanBeReused
          node scripts/verify-test-log.mjs .build/summary-output.log testActualCanonicalTokenizerCountsBudgetBoundariesCancellationAndUnload
          node scripts/verify-test-log.mjs .build/summary-output.log testDefaultPinnedQwenServiceSavesSummaryAndSelectedAnswerThenReleasesActualInstallation
          node scripts/verify-test-log.mjs .build/summary-output.log testActualQwenMapsAndValidatesGroundedDecisionsActionsAndUnknownAttributes testActualPinnedQwenAnswersSelectedBudgetAndPreservesUnknownOwnerDespiteOtherMeetingAnswer

  # Native SDK assertions run independently during test-first core failures.
  # All three jobs remain mandatory for the overall workflow result.
  native-build:
    if: ${{ inputs.mode == 'validation' || inputs.mode == 'mvp3-integration' || inputs.mode == 'mvp3-functional' }}
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare verified device and simulator summary framework
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/prepare_asr_only.py --platform ios
          python3 docs/drafts/T17/prepare_native_summary.py --framework-only
      - name: Verify pinned XcodeGen archive and generate project
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p .agent-local/tools
          curl --fail --location --proto '=https' --proto-redir '=https' --retry 2 --retry-delay 4 --max-time 120 \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip \
            -o .agent-local/tools/xcodegen.zip
          test "$(wc -c < .agent-local/tools/xcodegen.zip | tr -d ' ')" = '4278764'
          printf '%s  %s\n' '4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806' '.agent-local/tools/xcodegen.zip' | shasum -a 256 -c -
          unzip -q .agent-local/tools/xcodegen.zip -d .agent-local/tools
          .agent-local/tools/xcodegen/bin/xcodegen --version | tee .agent-local/xcodegen-version.log
          grep -Fx 'Version: 2.46.0' .agent-local/xcodegen-version.log
          .agent-local/tools/xcodegen/bin/xcodegen generate --spec project.yml
      - name: Compile actual device and simulator products without signing
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -quiet -project LocalMinutes.xcodeproj -scheme LocalMinutes -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build/device -clonedSourcePackagesDirPath .agent-local/source-packages CODE_SIGNING_ALLOWED=NO LOCALMINUTES_SOURCE_COMMIT="$GITHUB_SHA" build
          xcodebuild -quiet -project LocalMinutes.xcodeproj -scheme LocalMinutes -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/simulator -clonedSourcePackagesDirPath .agent-local/source-packages CODE_SIGNING_ALLOWED=NO LOCALMINUTES_SOURCE_COMMIT="$GITHUB_SHA" build
      # XCTest later embeds its runner in the reused Debug simulator app. Inspect
      # the pristine compiled product first; retain the strict plug-in allowlist.
      - name: Inspect compiled plists and Mach-O products
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/native-tests/device-build.test.mjs
          node --test scripts/native-tests/library-fixture-build-boundary.test.mjs
      # The simulator-negative fixture must retain its pristine unsigned state.
      # Test installation later embeds/ad-hoc-signs XCTest in this Debug product.
      - name: Test real unsigned archive packaging
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/native-tests/package.test.mjs
      - name: Compile the unchanged physical protection oracle without claiming device execution
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -quiet build-for-testing -project LocalMinutes.xcodeproj -scheme LocalMinutesPhysicalDeviceValidation \
            -configuration Debug -destination 'generic/platform=iOS' -derivedDataPath build/device -clonedSourcePackagesDirPath .agent-local/source-packages \
            CODE_SIGNING_ALLOWED=NO LOCALMINUTES_SOURCE_COMMIT="$GITHUB_SHA"
          printf 'PHYSICAL_FILE_PROTECTION_CASES=7 EXECUTED=0 STATUS=NOT_RUN\n'
      - name: Select an installed iPhone simulator for native control tests
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices available --json > .agent-local/native-simulators.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          inventory = json.loads(Path('.agent-local/native-simulators.json').read_text())
          candidates = [(runtime, device) for runtime, devices in inventory['devices'].items()
                        if '.iOS-' in runtime and int(runtime.rsplit('.iOS-', 1)[1].split('-')[0]) >= 18
                        for device in devices
                        if device.get('isAvailable') and device['name'].startswith('iPhone')]
          assert candidates, 'No installed available iPhone simulator'
          runtime, device = next((item for item in candidates if item[0].endswith('iOS-26-2')),
                                 candidates[0])
          with open(os.environ['GITHUB_ENV'], 'a') as environment:
              environment.write(f"LOCALMINUTES_TEST_SIMULATOR={device['udid']}\n")
          print(json.dumps({'nativeTestRuntime': runtime, 'nativeTestDevice': device}))
          PY
      - name: Execute actual app-hosted recording intent tests
        id: native-app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild test -project LocalMinutes.xcodeproj -scheme LocalMinutes -configuration Debug \
            -destination "platform=iOS Simulator,id=$LOCALMINUTES_TEST_SIMULATOR" -destination-timeout 120 \
            -parallel-testing-enabled NO -collect-test-diagnostics never -only-testing:LocalMinutesAppTests \
            -derivedDataPath build/simulator -clonedSourcePackagesDirPath .agent-local/source-packages -resultBundlePath .agent-local/native-app.xcresult \
            CODE_SIGNING_ALLOWED=NO LOCALMINUTES_SOURCE_COMMIT="$GITHUB_SHA" \
            2>&1 | tee .agent-local/native-app-tests.log
      - name: Require actual native cases and inspect their result bundle
        if: ${{ !cancelled() && (steps.native-app.outcome == 'success' || steps.native-app.outcome == 'failure') }}
        shell: bash
        run: |
          set -euo pipefail
          xcrun xcresulttool get test-results summary --path .agent-local/native-app.xcresult \
            > .agent-local/native-app-summary.json
          xcrun xcresulttool get test-results tests --path .agent-local/native-app.xcresult \
            > .agent-local/native-app-cases.json
          cat .agent-local/native-app-summary.json
          node scripts/verify-test-log.mjs .agent-local/native-app-tests.log \
            testUnavailableRealModelPreventsEveryOSResourceStart \
            testStopDuringHeldPreparationWaitsForExitAndRejectsLateReady \
            testDuplicateStartAndCoalescedStopOwnExactlyOneSetOfResources \
            testActualOwnedAudioReachesRecordingOnlyWithAllThreeFactsAndProducesRealCAF \
            testDisabledOrInactiveActivityCannotStartTheMicrophone \
            testDeniedMicrophoneEndsTheOwnedActivityWithoutRecordingSuccess \
            testHeldActivityEndKeepsCleanupPendingAfterRealAudioFlushAndDeactivation \
            testToggleStartsStopsAndRetriesPendingActivityCleanupWithoutNewCapture \
            testFailedDeactivationKeepsActivityAndExplicitStopRetryDoesNotRestartCapture \
            testUnexpectedActivityLossCannotCompleteAndOldCallbacksCannotStopReplacement \
            testToggleDuringDomainReservationCancelsTheAdmittedStart \
            testCancellingStartDuringPermissionReleasesTheActivityAndOwner \
            testIntentMissingModelReportsBlockedWithoutAnyOSResources \
            testIntentReportsStartingUntilActualFirstBufferThenRecording \
            testIntentDuplicateStartPreservesTheExistingEpochAndResourceSet \
            testIntentDeniedMicrophoneRequiresForegroundAfterActivityCleanup \
            testIntentUnavailableAudioSessionRequiresForegroundAfterActivityCleanup \
            testIntentDisabledOrInitiallyPendingActivityRequiresForegroundWithoutMicrophone \
            testIntentStopAcknowledgesActualSavedCAFOnlyAfterCleanup \
            testIntentIdleStopReturnsIdleWithoutCreatingResources \
            testIntentStaleLockScreenStopCannotStopAReplacementAndMatchingOwnerStopWorks \
            testIntentMissingActivityEndReportsCleanupPendingAndRetryNeverClaimsSavedSuccess \
            testIntentToggleUsesOwnerPhaseAndLaterToggleCanStartANewEpoch \
            testIntentCannotAttributeAReplacementManifestToAnEarlierStopOrToggle \
            testNativeDefaultRootAndIntentsShareApplicationAndMissingModelIsBlocked \
            testNativeStartUsesInjectedRealOwnerAndWaitsForActualBufferReadiness \
            testNativeGenericStopWaitsForActualSavedCAFAndAllResourceCleanup \
            testNativeToggleStopsExistingOwnerAndLaterInvocationStartsNewEpoch \
            testNativeActivityStopParameterRejectsMalformedAndStaleIDsBeforeMatchingStop \
            testNativeStopKeepsFailedEndPendingAndExplicitRetryPreservesFailure \
            testNativeForegroundRequestFailureNeverChangesDeniedCaptureIntoSuccess \
            testNativeSDKConformancesAndThreeDiscoverableShortcutsArePresent \
            testNativeOverlappingTogglesShareOneCleanupAndALaterCallCanStart \
            testNativeCancelledStartAndToggleCannotActivateAfterHeldModelPreparation \
            testNativeSecondToggleCancelsHeldPreparationInsteadOfCoalescingAStart \
            testActivityTimerStartsOnlyAtRecordingAndDoesNotResetOnUpdates \
            testActivityTerminalTimerRemainsFixedAndCannotEndBeforeItsStart \
            testFailedPreparationHasNoRecordingTimerAndDefaultPayloadContainsNoMeetingText \
            testNativeScopedActivityStopDeclaresBackgroundExecution
          node scripts/verify-test-log.mjs .agent-local/native-app-tests.log testSimulatorProtectionCapabilityIsReportedWithoutPhysicalVerification testDefaultServicesUseExcludedPrivatePersistentRoots testVerifiedModelCopyAndAtomicPointerPreserveSourceBytesAndPermissions testSQLiteSidecarRecreationAndCAFCheckpointRemainExcludedPrivateAndReadable testSymlinkPreflightAndAtomicReplacementPreserveOutsideFilesAndCleanTemporaryFiles
          node scripts/verify-test-log.mjs .agent-local/native-app-tests.log testOwnerWaitsForTranscriptFinalizationBeforeAcknowledgingSavedAudio testTranscriptFinalizationFailureCannotPublishRecordingSaved testDelayedPlaybackCannotActivateAfterStartReservationBeforeDomainPhaseChanges testDelayedPlaybackCannotActivateAfterToggleReservationBeforeDomainPhaseChanges testDelayedPlaybackIsBlockedWhileRealOwnerPreparationIsHeld testDelayedPlaybackCannotReconfigureOrDeactivateAnActiveRealCapture testRecordingClosesAdmittedPlaybackBeforeAnyCaptureActivation testFailedPlaybackDeactivationPreventsCaptureAndRemainsExplicitlyRetryable testStoppingBlocksPlaybackUntilActualCAFFlushAndActivityEndSettle testFailedCaptureDeactivationBlocksPlaybackUntilExplicitCaptureCleanupRetry
          node scripts/verify-test-log.mjs .agent-local/native-app-tests.log testGlobalStopRevokesAPlayAwaitingItsSnapshotAndALaterPlayCanStart testCancelledPendingPlayCannotActivateAndALaterPlayCanStart testScopedOldRequestCleanupCannotStopAReplacementPlayer
          node scripts/verify-test-log.mjs .agent-local/native-app-tests.log testAppStartReconcilesInterruptedCAFBeforeRealMissingModelRejection testClosedDatabaseStartupFailureLeavesOwnerIdleAndRefusesModelPreflight
          node scripts/verify-test-log.mjs .agent-local/native-app-tests.log testNativeInterruptionNotificationDrainsCAFWaitsForCleanupAndRejectsOldTap testNativeMediaResetCancelsPendingCaptureAndStaleEpochEndCannotDetachReplacement
          node scripts/verify-test-log.mjs .agent-local/native-app-tests.log testNativeApplicationRetainsSignalObservationAfterStartReturnsAndInterruptsActualCAF testNativeStaleAppStopCannotDetachReplacementSignalObservation
          node scripts/verify-test-log.mjs .agent-local/native-app-tests.log testNativeApplicationObservesResetBeforePermissionReturnsAndRejectsLateGrant
          node scripts/verify-test-log.mjs .agent-local/native-app-tests.log testInterruptionDuringHeldModelPreparationSettlesInterruptedAndAllowsReplacement
          node scripts/verify-test-log.mjs .agent-local/native-app-tests.log testDefaultServicesRetainOneLiveRecorderWithActualBuildAndModelPins testAppScenePhaseControlRecordsTruthfulBoundedVisibilityCheckpoints testAppPersistsProtectedAtomicMetricsJSONAndExportsOnlyValidatedFacts
          node scripts/verify-test-log.mjs .agent-local/native-app-tests.log testHeldSummaryOrQAHeavyClaimBlocksActualOwnerBeforePreparationAndOSUse testActualASRReservationHoldsHeavyGateThroughPreparationTranscriptActivityAndAsyncFinish testDefaultServicesShareOneHeavyGateAcrossIntelligenceAndActualRecordingOwner
          node scripts/verify-test-log.mjs .agent-local/native-app-tests.log \
            testDisplayedBuildIdentityReadsTheActualHostedAppBundleVersionAndBuild \
            testSummaryCitationRetainsMeetingAndExactSegmentIdentityAlongsideValidatedPlaybackOffset \
            testAnswerCitationWithSameOffsetAsAnotherMeetingStillTargetsOnlySelectedTranscriptRow \
            testForeignUnknownOutOfBoundsAndUnsupportedQuoteCitationsCannotCreateNavigationTargets \
            testOwningSceneNotificationsOpaqueCoverTheHostedRootAndRestoreAccessibility \
            testActualHomeRootPrivacyPreservesRunningOwnedCaptureAndRealCAFFlush \
            testActualIntentPublishesNewestMeetingThroughTheRetainedApplicationRouterWithoutRecording \
            testPresenterUsesActualDefaultServiceFirstPCMOriginAndMeasuredPendingSamples
          node scripts/verify-test-log.mjs .agent-local/native-app-tests.log \
            testFreshServicesInitializeBindsPersistedAlternativeSummaryInsteadOfDefaultPhi \
            testFreshServicesInitializeHonorsExplicitlyClearedSummarySelection \
            testFreshServicesWithoutSelectionRecordRetainsLegacyDefaultPhiBinding \
            testProductionControllerFirstRequestUsesRestoredSelectionRatherThanCapturingDefaultBeforeStartup \
            testProductionControllerWithRestoredUnequipShowsModelRequiredWithoutResurrectingPhi
      - name: Execute actual recording-control UI test
        id: native-ui
        if: ${{ !cancelled() && (steps.native-app.outcome == 'success' || steps.native-app.outcome == 'failure') }}
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild test -project LocalMinutes.xcodeproj -scheme LocalMinutes -configuration Debug \
            -destination "platform=iOS Simulator,id=$LOCALMINUTES_TEST_SIMULATOR" -destination-timeout 120 \
            -parallel-testing-enabled NO -collect-test-diagnostics never -only-testing:LocalMinutesUITests \
            -derivedDataPath build/simulator -clonedSourcePackagesDirPath .agent-local/source-packages -resultBundlePath .agent-local/native-ui.xcresult \
            CODE_SIGNING_ALLOWED=NO LOCALMINUTES_SOURCE_COMMIT="$GITHUB_SHA" \
            2>&1 | tee .agent-local/native-ui-tests.log
      - name: Require actual control UI assertion and inspect its result bundle
        if: ${{ !cancelled() && (steps.native-ui.outcome == 'success' || steps.native-ui.outcome == 'failure') }}
        shell: bash
        run: |
          set -euo pipefail
          xcrun xcresulttool get test-results summary --path .agent-local/native-ui.xcresult \
            > .agent-local/native-ui-summary.json
          cat .agent-local/native-ui-summary.json
          node scripts/verify-test-log.mjs .agent-local/native-ui-tests.log testActualHistoryDetailsAndTranscriptSearchStayWithinTheSelectedMeeting testManualNoteNavigationAndRelaunchPreserveTheEditWithoutChangingAnotherMeeting testEditableGeneratedSummaryAndAskMissingModelStaySeparateFromOriginalsAndOtherMeetings
          node scripts/verify-test-log.mjs .agent-local/native-ui-tests.log \
            testStartExplainsMissingSpeechModelWithoutClaimingRecording \
            testSharedActivityStopControlDispatchesItsExactSessionToTheApplicationOwner \
            testSharedActivityTerminalTimerIsFixedAndStopIsDisabled
          node scripts/verify-test-log.mjs .agent-local/native-ui-tests.log \
            testInstalledModelSpokenActionsIncludePurposeAndDistinctModelIdentity \
            testInstalledModelActionsRemainReachableWith44PointTargetsAtLargestAccessibilityText \
            testActualRecordAndModelsScreensExplainMicrophoneLiveActivityAndDisplayVersionAndBuild \
            testActualHistoryRowsReportOnlyTheirOwnPersistedTranscriptAndSummaryAvailability
      - name: Create and verify ephemeral unsigned package without uploading
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import { createUnsignedIPA } from './scripts/package-ios.mjs';
          import { readFileSync } from 'node:fs';
          const result = await createUnsignedIPA({
            appPath: 'build/device/Build/Products/Release-iphoneos/LocalMinutes.app',
            outputDirectory: 'build/package', sourceCommit: process.env.GITHUB_SHA
          });
          console.log(readFileSync(result.manifestPath, 'utf8'));
          console.log(readFileSync(result.checksumPath, 'utf8'));
          JS
          export LOCALMINUTES_AUDIT_IPA="$PWD/build/package/$(python3 -c "import json;print(json.load(open('build/package/build-manifest.json'))['artifact'])")"
          export LOCALMINUTES_AUDIT_SOURCE_COMMIT="$GITHUB_SHA"
          export LOCALMINUTES_AUDIT_IPA_SHA256="$(python3 -c "import json;print(json.load(open('build/package/build-manifest.json'))['sha256'])")"
          python3 -m unittest discover -s scripts/native-hygiene-tests -p 'test_*.py' -v

      - name: Retain passing native MVP3 package without a second device compilation
        if: ${{ success() && (inputs.mode == 'mvp3-integration' || inputs.mode == 'mvp3-functional') && inputs.retainMVP3 }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MVP_TAG="mvp-preview-${GITHUB_SHA:0:12}"
          gh release view "$MVP_TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,tagName,targetCommitish > .agent-local/mvp3-release.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          release = json.loads(Path('.agent-local/mvp3-release.json').read_text())
          assert release['isDraft'] is True, 'MVP assets must stay unpublished'
          assert release['targetCommitish'] == os.environ['GITHUB_SHA']
          assert release['tagName'] == 'mvp-preview-' + os.environ['GITHUB_SHA'][:12]
          PY
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          packages = []
          for checkout in sorted(Path('.agent-local/source-packages/checkouts').iterdir()):
              if checkout.is_dir():
                  revision = subprocess.check_output(['git', '-C', str(checkout), 'rev-parse', 'HEAD'], text=True, timeout=10).strip()
                  packages.append({'package': checkout.name, 'revision': revision})
          resolved = []
          for path in sorted(Path('LocalMinutes.xcodeproj').rglob('Package.resolved')):
              resolved.append({'path': str(path), 'contents': json.loads(path.read_text())})
          receipt = {'sourceCommit': os.environ['GITHUB_SHA'], 'packageCheckouts': packages,
                     'resolvedPackages': resolved,
                     'asrBuild': json.loads(Path('Vendor/SherpaASROnly/Artifacts/SherpaOnnxC.receipt.json').read_text()),
                     'bundledNoticesSHA256': hashlib.sha256(Path('Resources/THIRD_PARTY_NOTICES.txt').read_bytes()).hexdigest()}
          output = Path('build/package/dependency-receipt.json')
          output.write_text(json.dumps(receipt, indent=2) + '\n')
          Path(str(output) + '.sha256').write_text(hashlib.sha256(output.read_bytes()).hexdigest() + '  ' + output.name + '\n')
          PY
          gh release upload "$MVP_TAG" --repo "$GITHUB_REPOSITORY" \
            build/package/*.ipa build/package/*.sha256 build/package/build-manifest.json build/package/dependency-receipt.json

  # Owner-requested MVP delivery: compile/package only, no test runner or model weights.
  # The workflow definition and the reviewed app source are recorded separately.
  mvp-package:
    if: ${{ inputs.mode == 'mvp' || inputs.mode == 'features' || inputs.mode == 'package' || inputs.mode == 'model-delivery' || ((inputs.mode == 'mvp2-parakeet' || inputs.mode == 'mvp4-storage' || inputs.mode == 'mvp4-final') && inputs.packageMVP2) }}
    runs-on: ${{ (inputs.mode == 'mvp2-parakeet' || inputs.mode == 'mvp4-storage' || inputs.mode == 'mvp4-final') && 'macos-15' || 'macos-15-intel' }}
    timeout-minutes: ${{ (inputs.mode == 'mvp4-storage' || inputs.mode == 'mvp4-final') && 45 || 25 }}
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      EXPECTED_SOURCE: ${{ inputs.mode != 'mvp' && github.sha || inputs.sourceCommit }}
      DELIVERY_MODE: ${{ inputs.mode }}
    steps:
      - name: Check out the exact selected app source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.mode != 'mvp' && github.sha || inputs.sourceCommit }}
          persist-credentials: false
      - name: Verify exact reviewed source and zero-spend packaging guard
        shell: bash
        run: |
          set -euo pipefail
          if [ "$DELIVERY_MODE" != 'mvp' ]; then
            test "$EXPECTED_SOURCE" = "$GITHUB_SHA"
          else
            test "$EXPECTED_SOURCE" = 'db1b8d51c5ff72bf1d8abfd13f99a1da06a11e04'
          fi
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          python3 - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path('project-config.json').read_text())
          assert config['ci']['costGuardVerified'] is True
          assert config['budget']['maximumAdditionalSpendEUR'] == 0
          assert config['budget']['allowLargerRunners'] is False
          assert config['github']['publicationApproved'] is True
          assert config['github']['visibility'] == 'public'
          PY
          printf 'MVP_APP_SOURCE=%s\nWORKFLOW_SOURCE=%s\nTESTS_EXECUTED=0\n' "$EXPECTED_SOURCE" "$GITHUB_SHA"
      - name: Prepare the pinned native framework without model weights
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/prepare_asr_only.py --platform ios
          python3 docs/drafts/T17/prepare_native_summary.py --framework-only
      - name: Generate the reviewed iPhone project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .agent-local/tools
          curl --fail --location --proto '=https' --proto-redir '=https' --retry 2 --retry-delay 4 --max-time 120 \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip -o .agent-local/tools/xcodegen.zip
          test "$(wc -c < .agent-local/tools/xcodegen.zip | tr -d ' ')" = '4278764'
          printf '%s  %s\n' '4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806' '.agent-local/tools/xcodegen.zip' | shasum -a 256 -c -
          unzip -q .agent-local/tools/xcodegen.zip -d .agent-local/tools
          .agent-local/tools/xcodegen/bin/xcodegen generate --spec project.yml
      - name: Compile the iPhone app and embedded Live Activity extension
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -quiet -project LocalMinutes.xcodeproj -scheme LocalMinutes -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build/device \
            -clonedSourcePackagesDirPath .agent-local/source-packages \
            CODE_SIGNING_ALLOWED=NO LOCALMINUTES_SOURCE_COMMIT="$EXPECTED_SOURCE" build
      - name: Package the unsigned IPA and record its checksum
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import { createUnsignedIPA } from './scripts/package-ios.mjs';
          import { readFileSync } from 'node:fs';
          const result = await createUnsignedIPA({
            appPath: 'build/device/Build/Products/Release-iphoneos/LocalMinutes.app',
            outputDirectory: 'build/package', sourceCommit: process.env.EXPECTED_SOURCE
          });
          console.log(readFileSync(result.manifestPath, 'utf8'));
          console.log(readFileSync(result.checksumPath, 'utf8'));
          JS
      - name: Check actual native symbols and package privacy for the storage-report build
        if: ${{ inputs.mode == 'mvp4-storage' || inputs.mode == 'mvp4-final' }}
        shell: bash
        run: |
          set -euo pipefail
          export LOCALMINUTES_AUDIT_IPA="$PWD/build/package/$(python3 -c "import json;print(json.load(open('build/package/build-manifest.json'))['artifact'])")"
          export LOCALMINUTES_AUDIT_SOURCE_COMMIT="$GITHUB_SHA"
          export LOCALMINUTES_AUDIT_IPA_SHA256="$(python3 -c "import json;print(json.load(open('build/package/build-manifest.json'))['sha256'])")"
          python3 -m unittest discover -s scripts/native-hygiene-tests -p 'test_*.py' -v
      - name: Retain the package in the existing unpublished owner draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MVP_TAG="mvp-preview-${EXPECTED_SOURCE:0:12}"
          gh release view "$MVP_TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,tagName,targetCommitish > .agent-local/mvp-release.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          release = json.loads(Path('.agent-local/mvp-release.json').read_text())
          assert release['isDraft'] is True, 'MVP assets must stay unpublished'
          assert release['targetCommitish'] == os.environ['EXPECTED_SOURCE']
          assert release['tagName'] == 'mvp-preview-' + os.environ['EXPECTED_SOURCE'][:12]
          PY
          if [[ "$DELIVERY_MODE" == mvp4-storage || "$DELIVERY_MODE" == mvp4-final ]]; then
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          packages = []
          for checkout in sorted(Path('.agent-local/source-packages/checkouts').iterdir()):
              if checkout.is_dir():
                  revision = subprocess.check_output(['git', '-C', str(checkout), 'rev-parse', 'HEAD'], text=True, timeout=10).strip()
                  packages.append({'package': checkout.name, 'revision': revision})
          resolved = []
          for path in sorted(Path('LocalMinutes.xcodeproj').rglob('Package.resolved')):
              resolved.append({'path': str(path), 'contents': json.loads(path.read_text())})
          receipt = {'sourceCommit': os.environ['GITHUB_SHA'], 'packageCheckouts': packages,
                     'resolvedPackages': resolved,
                     'asrBuild': json.loads(Path('Vendor/SherpaASROnly/Artifacts/SherpaOnnxC.receipt.json').read_text()),
                     'bundledNoticesSHA256': hashlib.sha256(Path('Resources/THIRD_PARTY_NOTICES.txt').read_bytes()).hexdigest()}
          output = Path('build/package/dependency-receipt.json')
          output.write_text(json.dumps(receipt, indent=2) + '\n')
          Path(str(output) + '.sha256').write_text(hashlib.sha256(output.read_bytes()).hexdigest() + '  ' + output.name + '\n')
          PY
          gh release upload "$MVP_TAG" --repo "$GITHUB_REPOSITORY" \
            build/package/*.ipa build/package/*.sha256 build/package/build-manifest.json build/package/dependency-receipt.json
          else
          gh release upload "$MVP_TAG" --repo "$GITHUB_REPOSITORY" \
            build/package/*.ipa build/package/*.sha256 build/package/build-manifest.json
          fi

  # One end-of-batch real-model observation per independent flow, in parallel.
  # Existing full validation is preserved separately; no per-change test loop.
  feature-model-check:
    if: ${{ inputs.mode == 'features' }}
    name: Local model (${{ matrix.flow }})
    runs-on: macos-15-intel
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - flow: service
            filter: ActualIntelligenceCompositionTests
            cases: testDefaultPinnedQwenServiceSavesSummaryAndSelectedAnswerThenReleasesActualInstallation
          - flow: summary
            filter: ActualSummaryPipelineTests
            cases: testActualQwenMapsAndValidatesGroundedDecisionsActionsAndUnknownAttributes
          - flow: questions
            filter: ActualQwenMeetingQuestionTests
            cases: testActualPinnedQwenAnswersSelectedBudgetAndPreservesUnknownOwnerDespiteOtherMeetingAnswer
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      MODEL_FILTER: ${{ matrix.filter }}
      MODEL_CASE: ${{ matrix.cases }}
    steps:
      - name: Check out exact batched source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify zero-spend guard and prepare the actual pinned model
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import json
          from pathlib import Path
          c = json.loads(Path('project-config.json').read_text())
          assert c['ci']['costGuardVerified'] is True
          assert c['budget']['maximumAdditionalSpendEUR'] == 0
          assert c['budget']['allowLargerRunners'] is False
          assert c['github']['visibility'] == 'public'
          PY
          python3 scripts/prepare_asr_only.py --platform macos
          python3 docs/drafts/T17/prepare_native_summary.py
      - name: Exercise this actual local-model flow once
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build
          swift test --filter "$MODEL_FILTER" 2>&1 | tee .build/feature-model-output.log
      - name: Record the actual flow result without hiding failures
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-test-log.mjs .build/feature-model-output.log "$MODEL_CASE"
