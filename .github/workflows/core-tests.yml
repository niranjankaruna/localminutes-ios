name: LocalMinutes build or validation

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Build the MVP package, or explicitly run the saved validation jobs
        required: true
        type: choice
        default: mvp
        options: [mvp, features, package, validation, candidate, candidate-summary, candidate-summary-parts, model-catalog, model-integration, model-repair, model-delivery, mvp2-red, mvp2, mvp2-integration]
      sourceCommit:
        description: Reviewed app source for the MVP package
        required: true
        default: db1b8d51c5ff72bf1d8abfd13f99a1da06a11e04

permissions:
  contents: read

concurrency:
  group: localminutes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mvp2-portable:
    if: ${{ inputs.mode == 'mvp2-red' || inputs.mode == 'mvp2' || inputs.mode == 'mvp2-integration' }}
    runs-on: macos-15-intel
    timeout-minutes: 12
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify free-runner guard and prepare pinned framework linkage only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import json
          from pathlib import Path
          c = json.loads(Path('project-config.json').read_text())
          assert c['ci']['costGuardVerified'] is True
          assert c['budget']['maximumAdditionalSpendEUR'] == 0
          assert c['budget']['allowLargerRunners'] is False
          assert c['github']['visibility'] == 'public'
          PY
          python3 docs/drafts/T17/prepare_native_summary.py --framework-only
      - name: Run the MVP2 contracts or their focused module regressions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build
          if [ "${{ inputs.mode }}" = mvp2-red ]; then
            filter='CoreTests[.]MeetingArchiveTests|ModelTests[.]DownloadResumeTests|PersistenceTests[.]SQLiteSnapshotTests|SummaryTests[.]SummaryResumePipelineTests'
          elif [ "${{ inputs.mode }}" = mvp2-integration ]; then
            filter='CoreTests[.]|ModelTests[.]|PersistenceTests[.]|SummaryTests[.](SummaryResumePipelineTests|SummaryPipelineTests|GroundedSummaryTests|NestedStructuredSchemaTests|StructuredJSONSchemaTests)|IntelligenceTests[.]SummaryResumeIntelligenceTests|MeetingLibraryTests[.](LibraryArchiveCoordinatorTests|MeetingDeletionArtifactTests)'
          else
            filter='CoreTests[.]|ModelTests[.]|PersistenceTests[.]|SummaryTests[.](SummaryResumePipelineTests|SummaryPipelineTests|GroundedSummaryTests|NestedStructuredSchemaTests|StructuredJSONSchemaTests)'
          fi
          swift test --filter "$filter" 2>&1 | tee .build/mvp2-portable.log
      - name: Require genuine discovered MVP2 assertions
        if: always()
        shell: bash
        run: |
          node scripts/verify-test-log.mjs .build/mvp2-portable.log \
            testCancelledPipelinePersistsValidatedPrefixAndReopenedPipelineGeneratesOnlyMissingMaps \
            testNativeSnapshotIncludesCommittedWALSourcesNotesGeneratedEditsAndFTSAsStandaloneDatabase

  mvp2-recovery:
    if: ${{ inputs.mode == 'mvp2-red' || inputs.mode == 'mvp2' || inputs.mode == 'mvp2-integration' }}
    runs-on: macos-15-intel
    timeout-minutes: 12
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare only the reviewed actual speech fixtures
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 docs/drafts/T17/prepare_native_summary.py --framework-only
          python3 docs/drafts/T10/prepare_whisper_fixture.py
          python3 docs/drafts/T10/prepare_native_fixture.py
          printf 'LOCALMINUTES_ASR_MODEL_DIRECTORY=%s/.agent-local/asr-evaluation/native-fixtures/model\n' "$PWD" >> "$GITHUB_ENV"
          printf 'LOCALMINUTES_ASR_FIXTURE_PATH=%s/.agent-local/asr-evaluation/native-fixtures/6930-75918-0000.flac\n' "$PWD" >> "$GITHUB_ENV"
      - name: Exercise captured-model recovery and journal integrity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build
          if [ "${{ inputs.mode }}" = mvp2-red ]; then
            filter='ASRTests[.](TranscriptionReplayCheckpointIntegrityTests|SelectedModelRecoveryTests)'
          else
            filter='ASRTests[.](TranscriptionReplayCheckpointIntegrityTests|SelectedModelRecoveryTests|RecoveredTranscriptionReplayTests)'
          fi
          swift test --filter "$filter" 2>&1 | tee .build/mvp2-recovery.log
      - name: Require actual model-backed recovery assertions
        if: always()
        run: node scripts/verify-test-log.mjs .build/mvp2-recovery.log testCursorOnlyJumpToTimelineEndCannotSkipRemainingActualSpeechAfterReopen testActualWhisperPreparationPersistsCoherentImmutableMeetingPinBeforeFirstAudioFrame

  focused-portable:
    if: ${{ inputs.mode == 'candidate-summary-parts' || inputs.mode == 'model-catalog' || inputs.mode == 'model-integration' || inputs.mode == 'model-repair' || inputs.mode == 'model-delivery' }}
    runs-on: macos-15-intel
    timeout-minutes: 8
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare pinned native linkage
        shell: bash
        run: |
          set -euo pipefail
          python3 docs/drafts/T17/prepare_native_summary.py --framework-only
          if [ "${{ inputs.mode }}" = model-catalog ]; then
            python3 docs/drafts/T10/prepare_whisper_fixture.py
          fi
      - name: Exercise only pending generated-save cancellation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p .build
          if [[ "${{ inputs.mode }}" == model-integration || "${{ inputs.mode }}" == model-repair || "${{ inputs.mode }}" == model-delivery ]]; then
            swift test --filter 'ModelTests[.](HuggingFaceRepositoryTests|ModelSelectionTests|ModelDeviceResourceReaderTests|ModelInstallationIdentityTests|ModelRuntimeCompatibilityTests)|CoreTests[.]TranscriptionMetricsTests|PersistenceTests[.]SummaryCheckpointStoreTests|SummaryTests[.](SummaryPipelineTests|GroundedSummaryTests|NestedStructuredSchemaTests|StructuredJSONSchemaTests)' 2>&1 | tee .build/focused-portable.log
          elif [ "${{ inputs.mode }}" = model-catalog ]; then
            swift test --filter 'ModelTests[.](HuggingFaceRepositoryTests|ModelSelectionTests)|ASRTests[.]WhisperSpeechRecognizerTests|SummaryTests[.](SummaryPipelineTests|GroundedSummaryTests|NestedStructuredSchemaTests|StructuredJSONSchemaTests)' 2>&1 | tee .build/focused-portable.log
          else
            swift test --filter 'IntelligenceSessionTests/testCancellationBeforeBlockedSQLiteCommitSavesNothingAndPreservesOriginalsAndModel' 2>&1 | tee .build/focused-portable.log
          fi
      - name: Require actual focused assertions
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.mode }}" == model-integration || "${{ inputs.mode }}" == model-repair || "${{ inputs.mode }}" == model-delivery ]]; then
            node scripts/verify-test-log.mjs .build/focused-portable.log testInstalledInventoryListsBothAlternativesDeterministicallyWithoutChangingEquipment
          elif [ "${{ inputs.mode }}" = model-catalog ]; then
            node scripts/verify-test-log.mjs .build/focused-portable.log testWhisperLoadsActualPinnedModelOnCPUOutsideMainThread
          else
            node scripts/verify-test-log.mjs .build/focused-portable.log testCancellationBeforeBlockedSQLiteCommitSavesNothingAndPreservesOriginalsAndModel
          fi
      - name: Verify focused package hygiene regressions
        run: node --test scripts/tests/whisper-package-policy.test.mjs scripts/tests/package-audit.test.mjs scripts/tests/ios-artifacts.test.mjs

  focused-app-metrics:
    if: ${{ inputs.mode == 'candidate-summary-parts' || inputs.mode == 'model-catalog' || inputs.mode == 'model-integration' || inputs.mode == 'model-repair' || inputs.mode == 'model-delivery' || inputs.mode == 'mvp2-integration' }}
    name: Native focused (${{ matrix.testclass }})
    runs-on: macos-15-intel
    timeout-minutes: ${{ (inputs.mode == 'model-delivery' || inputs.mode == 'mvp2-integration') && 18 || 15 }}
    strategy:
      fail-fast: false
      matrix:
        testclass: ${{ fromJSON(inputs.mode == 'mvp2-integration' && '["NativeMVP2LibraryTests"]' || inputs.mode == 'model-delivery' && '["MVP1Services"]' || (inputs.mode == 'model-integration' || inputs.mode == 'model-repair') && '["NativeAppMetricsTests","NativeModelResourceTests"]' || '["NativeAppMetricsTests"]') }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      NATIVE_TEST_CLASS: ${{ matrix.testclass }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify source and prepare pinned project tools
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import json
          from pathlib import Path
          c = json.loads(Path('project-config.json').read_text())
          assert c['ci']['costGuardVerified'] is True
          assert c['budget']['maximumAdditionalSpendEUR'] == 0
          assert c['budget']['allowLargerRunners'] is False
          assert c['github']['visibility'] == 'public'
          PY
          python3 docs/drafts/T17/prepare_native_summary.py --framework-only
          mkdir -p .agent-local/tools
          curl --fail --location --proto '=https' --proto-redir '=https' --retry 2 --retry-delay 4 --max-time 120 https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip -o .agent-local/tools/xcodegen.zip
          test "$(wc -c < .agent-local/tools/xcodegen.zip | tr -d ' ')" = '4278764'
          printf '%s  %s\n' '4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806' '.agent-local/tools/xcodegen.zip' | shasum -a 256 -c -
          unzip -q .agent-local/tools/xcodegen.zip -d .agent-local/tools
          .agent-local/tools/xcodegen/bin/xcodegen generate --spec project.yml
          xcrun simctl list devices available --json > .agent-local/focused-simulators.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          inventory = json.loads(Path('.agent-local/focused-simulators.json').read_text())
          candidates = [(runtime, device) for runtime, devices in inventory['devices'].items()
                        if '.iOS-' in runtime and int(runtime.rsplit('.iOS-', 1)[1].split('-')[0]) >= 18
                        for device in devices if device.get('isAvailable') and device['name'].startswith('iPhone')]
          assert candidates
          runtime, device = next((item for item in candidates if item[0].endswith('iOS-26-2')), candidates[0])
          with open(os.environ['GITHUB_ENV'], 'a') as environment:
              environment.write(f"LOCALMINUTES_TEST_SIMULATOR={device['udid']}\n")
          print(json.dumps({'runtime': runtime, 'device': device['name']}))
          PY
      - name: Boot the simulator while the focused app builds
        shell: bash
        run: |
          xcrun simctl boot "$LOCALMINUTES_TEST_SIMULATOR" || true
          xcrun simctl bootstatus "$LOCALMINUTES_TEST_SIMULATOR" -b > .agent-local/focused-simulator-boot.log 2>&1 &
      - name: Execute only the selected default-app service contracts
        shell: bash
        run: |
          set -euo pipefail
          if [ "$NATIVE_TEST_CLASS" = MVP1Services ]; then
            native_cases=(-only-testing:LocalMinutesAppTests/NativeAppMetricsTests -only-testing:LocalMinutesAppTests/NativeModelResourceTests)
          else
            native_cases=("-only-testing:LocalMinutesAppTests/$NATIVE_TEST_CLASS")
          fi
          xcodebuild test -project LocalMinutes.xcodeproj -scheme LocalMinutesFocusedValidation -configuration Debug \
            -destination "platform=iOS Simulator,id=$LOCALMINUTES_TEST_SIMULATOR" -destination-timeout 120 \
            -parallel-testing-enabled NO -collect-test-diagnostics never "${native_cases[@]}" \
            -derivedDataPath build/focused-app -clonedSourcePackagesDirPath .agent-local/source-packages \
            -resultBundlePath .agent-local/focused-app-metrics.xcresult \
            CODE_SIGNING_ALLOWED=NO LOCALMINUTES_SOURCE_COMMIT="$GITHUB_SHA" 2>&1 | tee .agent-local/focused-app-metrics.log
      - name: Require the focused native assertions
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -d .agent-local/focused-app-metrics.xcresult ]; then
            if xcrun xcresulttool get test-results summary --path .agent-local/focused-app-metrics.xcresult > .agent-local/focused-native-summary.json; then
              cat .agent-local/focused-native-summary.json
            fi
          fi
          if [ -f .agent-local/focused-simulator-boot.log ]; then
            tail -40 .agent-local/focused-simulator-boot.log
          fi
          if [ "$NATIVE_TEST_CLASS" = NativeMVP2LibraryTests ]; then
            node scripts/verify-test-log.mjs .agent-local/focused-app-metrics.log \
              testDefaultAppManagerResumesPinnedDownloadThroughItsConfiguredTransportAndPublishesVerifiedInstallation \
              testAppSceneSamplingUsesActualResidentMemoryAndOneRetainedPrivateEnduranceRecorder \
              testDefaultServicesOpenSelectedGenerationAndKeepOuterModelStorageAndSelection \
              testRestoringClosedBackupRebindsAppServicesAndOwnerWhilePreservingPreviousLibraryAndModels \
              testRestoreRefusesSharedRecordingAdmissionBeforeClosingOrReplacingCurrentData \
              testInvalidSelectedGenerationFailsWithoutFallingBackToOrRewritingLegacyData \
              testAppDeleteMeetingRemovesAudioTranscriptNotesSummaryAnswersAndPendingCacheAndRefreshesSelection
          elif [ "$NATIVE_TEST_CLASS" = NativeModelResourceTests ]; then
            node scripts/verify-test-log.mjs .agent-local/focused-app-metrics.log testModelResourcesReadActualVolumeAndPhysicalRAMWithoutFabricatedCapacity testModelResourcesDoNotInventFreeStorageForAnUnusablePath
          else
            node scripts/verify-test-log.mjs .agent-local/focused-app-metrics.log \
            testDefaultServicesRetainOneLiveRecorderWithActualBuildAndModelPins \
            testAppScenePhaseControlRecordsTruthfulBoundedVisibilityCheckpoints \
            testAppPersistsProtectedAtomicMetricsJSONAndExportsOnlyValidatedFacts
            if [ "$NATIVE_TEST_CLASS" = MVP1Services ]; then
              node scripts/verify-test-log.mjs .agent-local/focused-app-metrics.log testModelResourcesReadActualVolumeAndPhysicalRAMWithoutFabricatedCapacity testModelResourcesDoNotInventFreeStorageForAnUnusablePath
            fi
          fi

  actual-summary-resume:
    if: ${{ inputs.mode == 'mvp2-integration' }}
    runs-on: macos-15-intel
    timeout-minutes: 18
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare the reviewed local summary runtime and actual model
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 docs/drafts/T17/prepare_native_summary.py --framework-only
          python3 docs/drafts/T17/prepare_phi3_candidate.py
      - name: Exercise one actual model through cancelled commit and reopened resume
        shell: bash
        run: |
          set -euo pipefail
          export LOCALMINUTES_PHI_MODEL_PATH="$LOCALMINUTES_CANDIDATE_MODEL_PATH"
          mkdir -p .build
          swift test --filter ActualResumedPhiIntelligenceTests 2>&1 | tee .build/actual-summary-resume.log
      - name: Require actual inference and durable resume assertions
        if: always()
        run: node scripts/verify-test-log.mjs .build/actual-summary-resume.log testActualPhiValidatedMapsSurviveCancelledCommitAndReopenedServiceCommitsWithoutRegeneration

  selected-model-integration:
    if: ${{ inputs.mode == 'model-integration' || inputs.mode == 'model-repair' || inputs.mode == 'model-delivery' }}
    name: Selected model (${{ matrix.flow }})
    runs-on: macos-15-intel
    timeout-minutes: ${{ matrix.flow == 'selected-summary' && 18 || 12 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.mode == 'model-delivery' && '{"include":[{"flow":"recovery-replay","filter":"RecoveredTranscriptionReplayTests","testcase":"testActualASRReplaysOnlyUntranscribedDurableCAFPreservesGlobalRangesAndIsIdempotentAfterReopen"},{"flow":"speech-metrics","filter":"ASRTests[.](SelectedWhisperLiveSessionTests|LiveTranscriptionSessionTests/(testActualCPUConsumerPublishesPrivateMonotonicProgressBeforeFinalFlush|testActualSequentialMeetingsReuseOneSessionWithIndependentMetricsEpochs))","testcase":"testEquippedWhisperStreamsLicensedSpeechBeforeStopAndPersistsFinalGlobalRanges"}]}' || inputs.mode == 'model-repair' && '{"include":[{"flow":"recovery-replay","filter":"RecoveredTranscriptionReplayTests","testcase":"testActualASRReplaysOnlyUntranscribedDurableCAFPreservesGlobalRangesAndIsIdempotentAfterReopen"}]}' || '{"include":[{"flow":"whisper-native","filter":"WhisperSpeechRecognizerTests","testcase":"testWhisperRollingWindowsPublishActualSpeechGlobalRangesAndNoRepeatedFinals"},{"flow":"whisper-live","filter":"SelectedWhisperLiveSessionTests","testcase":"testEquippedWhisperStreamsLicensedSpeechBeforeStopAndPersistsFinalGlobalRanges"},{"flow":"selected-summary","filter":"ActualSelectedModelIntelligenceTests","testcase":"testActualSelectedPhiDefaultLoaderSavesSummaryAndGuideAnswerWithOriginalsPreserved"}]}') }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      MODEL_FLOW: ${{ matrix.flow }}
      MODEL_FILTER: ${{ matrix.filter }}
      MODEL_CASE: ${{ matrix.testcase }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare only the selected actual pinned model
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 docs/drafts/T17/prepare_native_summary.py --framework-only
          if [ "$MODEL_FLOW" = selected-summary ]; then
            python3 docs/drafts/T17/prepare_phi3_candidate.py
          elif [[ "$MODEL_FLOW" == recovery-replay || "$MODEL_FLOW" == speech-metrics ]]; then
            python3 docs/drafts/T10/prepare_native_fixture.py
            printf 'LOCALMINUTES_ASR_MODEL_DIRECTORY=%s/.agent-local/asr-evaluation/native-fixtures/model\n' "$PWD" >> "$GITHUB_ENV"
            printf 'LOCALMINUTES_ASR_FIXTURE_PATH=%s/.agent-local/asr-evaluation/native-fixtures/6930-75918-0000.flac\n' "$PWD" >> "$GITHUB_ENV"
            if [ "$MODEL_FLOW" = speech-metrics ]; then
              python3 docs/drafts/T10/prepare_whisper_fixture.py
            fi
          else
            python3 docs/drafts/T10/prepare_whisper_fixture.py
          fi
      - name: Exercise only this selected-model flow
        shell: bash
        run: |
          set -euo pipefail
          if [ "$MODEL_FLOW" = selected-summary ]; then
            export LOCALMINUTES_PHI_MODEL_PATH="$LOCALMINUTES_CANDIDATE_MODEL_PATH"
          fi
          mkdir -p .build
          swift test --filter "$MODEL_FILTER" 2>&1 | tee .build/selected-model.log
      - name: Require real selected-flow assertions
        if: always()
        shell: bash
        run: |
          node scripts/verify-test-log.mjs .build/selected-model.log "$MODEL_CASE"
          if [ "$MODEL_FLOW" = speech-metrics ]; then
            node scripts/verify-test-log.mjs .build/selected-model.log testActualCPUConsumerPublishesPrivateMonotonicProgressBeforeFinalFlush testActualSequentialMeetingsReuseOneSessionWithIndependentMetricsEpochs
          fi

  phi3-candidate:
    if: ${{ inputs.mode == 'candidate' || inputs.mode == 'candidate-summary' || inputs.mode == 'candidate-summary-parts' || inputs.mode == 'model-catalog' }}
    name: Phi-3 (${{ matrix.testcase }})
    runs-on: macos-15-intel
    timeout-minutes: ${{ (inputs.mode == 'candidate-summary-parts' || inputs.mode == 'model-catalog') && 12 || inputs.mode == 'candidate-summary' && 8 || 18 }}
    strategy:
      fail-fast: false
      matrix:
        testcase: ${{ fromJSON((inputs.mode == 'candidate-summary-parts' || inputs.mode == 'model-catalog') && '["testActualPinnedPhi3PositiveSummaryWithReviewedRevision","testActualPinnedPhi3UnknownSummaryWithReviewedRevision"]' || inputs.mode == 'candidate-summary' && '["testActualPinnedPhi3ComparesTwoSummariesWithReviewedRevision"]' || '["testActualPinnedPhi3ComparesTwoSummariesAndTwoSelectedMeetingQuestions"]') }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      CANDIDATE_CASE: ${{ matrix.testcase }}
    steps:
      - name: Check out exact candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify zero-spend guard and candidate pins
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import json
          from pathlib import Path
          c = json.loads(Path('project-config.json').read_text())
          assert c['ci']['costGuardVerified'] is True
          assert c['budget']['maximumAdditionalSpendEUR'] == 0
          assert c['budget']['allowLargerRunners'] is False
          assert c['github']['visibility'] == 'public'
          assert c['github']['publicationApproved'] is True
          assert Path(c['ci']['costGuardEvidence'].split('#')[0]).is_file()
          PY
          python3 docs/drafts/T17/prepare_native_summary.py --framework-only
          python3 docs/drafts/T17/prepare_phi3_candidate.py
      - name: Exercise only the selected actual candidate case
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build
          swift test --filter "Phi3CandidateComparisonTests/$CANDIDATE_CASE" 2>&1 | tee .build/phi3-candidate-output.log
      - name: Require actual candidate discovery and assertions
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-test-log.mjs .build/phi3-candidate-output.log "$CANDIDATE_CASE"

  core:
    if: ${{ inputs.mode == 'validation' }}
    runs-on: macos-15-intel
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify source and record actual toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path('project-config.json').read_text())
          assert config['ci']['costGuardVerified'] is True, 'CI cost guard is unverified'
          assert config['budget']['maximumAdditionalSpendEUR'] == 0
          assert config['budget']['allowLargerRunners'] is False
          assert Path(config['ci']['costGuardEvidence'].split('#')[0]).is_file()
          PY
          printf 'SOURCE_SHA=%s\nRUNNER_IMAGE=%s\nRUNNER_OS=%s\n' "$GITHUB_SHA" "$ImageVersion" "$RUNNER_OS"
          sw_vers
          uname -m
          xcodebuild -version
          xcodebuild -showsdks
          swift --version
          xcrun simctl list devices available
      - name: Prepare verified licensed real speech and pinned model fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 docs/drafts/T10/prepare_native_fixture.py
          printf 'LOCALMINUTES_ASR_MODEL_DIRECTORY=%s/.agent-local/asr-evaluation/native-fixtures/model\n' "$PWD" >> "$GITHUB_ENV"
          printf 'LOCALMINUTES_ASR_FIXTURE_PATH=%s/.agent-local/asr-evaluation/native-fixtures/6930-75918-0000.flac\n' "$PWD" >> "$GITHUB_ENV"
      - name: Prepare pinned native summary framework and actual Qwen model
        shell: bash
        run: |
          set -euo pipefail
          python3 docs/drafts/T17/prepare_native_summary.py --framework-only
      - name: Execute XCTest assertions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build
          swift test --enable-code-coverage --filter '(HarnessTests|CoreTests|RecordingTests|ModelTests|PersistenceTests|ASRTests|MeetingLibraryTests|SummaryPromptFormatterTests|StructuredJSONSchemaTests|SummaryChunkPlannerTests|GroundedSummaryTests|SummaryTests[.]SummaryPipelineTests|SummaryTests[.]NestedStructuredSchemaTests|QuestionAnsweringTests[.]MeetingQuestionAnswererTests|IntelligenceTests[.]IntelligenceSessionTests)' 2>&1 | tee .build/test-output.log
          node --test scripts/tests/*.test.mjs
      - name: Require discovered tests and report evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
