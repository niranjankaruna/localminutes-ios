          node scripts/verify-test-log.mjs .agent-local/native-app-tests.log testSimulatorProtectionCapabilityIsReportedWithoutPhysicalVerification testDefaultServicesUseExcludedPrivatePersistentRoots testVerifiedModelCopyAndAtomicPointerPreserveSourceBytesAndPermissions testSQLiteSidecarRecreationAndCAFCheckpointRemainExcludedPrivateAndReadable testSymlinkPreflightAndAtomicReplacementPreserveOutsideFilesAndCleanTemporaryFiles
