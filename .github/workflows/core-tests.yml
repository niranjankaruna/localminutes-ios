    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare only exact v2 Core ML assets and licensed speech
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 scripts/prepare_asr_only.py --platform macos
          python3 docs/drafts/T17/prepare_native_summary.py --framework-only
          python3 docs/drafts/T10/prepare_native_parakeet_fixture.py
      - name: Exercise native Core ML TDT and actual selected capture
        shell: bash
        run: |
          set -euo pipefail
          export LOCALMINUTES_PARAKEET_COREML_MODEL_DIRECTORY="$PWD/.agent-local/parakeet-coreml-fixtures/model"
          export LOCALMINUTES_PARAKEET_COREML_FIXTURE_PATH="$PWD/.agent-local/parakeet-coreml-fixtures/6930-75918-0000.flac"
