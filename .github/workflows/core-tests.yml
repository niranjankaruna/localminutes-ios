            testNativeDefaultRootAndIntentsShareApplicationAndMissingModelIsBlocked \
            testNativeStartUsesInjectedRealOwnerAndWaitsForActualBufferReadiness \
            testNativeGenericStopWaitsForActualSavedCAFAndAllResourceCleanup \
            testNativeToggleStopsExistingOwnerAndLaterInvocationStartsNewEpoch \
            testNativeActivityStopParameterRejectsMalformedAndStaleIDsBeforeMatchingStop \
