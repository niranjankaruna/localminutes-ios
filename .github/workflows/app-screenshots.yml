name: Capture app UI for local download
run-name: Screenshots ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Unique request ID supplied by scripts/download-screenshots.mjs
        required: true
        type: string
      appearance:
        description: Appearance to capture
        type: choice
        default: both
        options: [both, light, dark]
      categories:
        description: Comma-separated categories (blank with no screens captures all; use --list locally)
        type: string
        default: ''
      screens:
        description: Comma-separated exact scene names, combined with categories
        type: string
        default: ''
      related:
        description: Include every scene in each named screen's category (requires screens)
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  capture:
    name: Capture selected app screens (${{ inputs.appearance }})
    runs-on: macos-15
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    outputs:
      artifact_id: ${{ steps.transfer.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate and report screenshot selection
        env:
          SCREENSHOT_APPEARANCE: ${{ inputs.appearance }}
          SCREENSHOT_CATEGORIES: ${{ inputs.categories }}
          SCREENSHOT_SCREENS: ${{ inputs.screens }}
          SCREENSHOT_RELATED: ${{ inputs.related }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync, mkdirSync, writeFileSync } from 'node:fs';
          import { expectedScreenshotNames, resolveScreenshotSelection } from './scripts/app-screenshots.mjs';
          const selection = await resolveScreenshotSelection({
            appearance: process.env.SCREENSHOT_APPEARANCE || 'both',
            categories: process.env.SCREENSHOT_CATEGORIES,
            screens: process.env.SCREENSHOT_SCREENS,
            related: process.env.SCREENSHOT_RELATED === 'true'
          });
          const json = JSON.stringify(selection);
          mkdirSync('.agent-local', { recursive: true });
          writeFileSync('.agent-local/screenshot-selection.json', json + '\n');
          appendFileSync(process.env.GITHUB_ENV, `TEST_RUNNER_LOCALMINUTES_SCREENSHOT_SELECTION=${json}\n`);
          const files = await expectedScreenshotNames(selection);
          const report = `Selected ${files.length} screenshots (${selection.appearances.join(', ')}):\n` + files.join('\n');
          console.log(report);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, '```text\n' + report + '\n```\n');
          JS
      - name: Prepare and generate iOS project
        run: bash scripts/prepare-ios.sh
      - name: Select and boot an iPhone simulator matching Xcode
        timeout-minutes: 3
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { appendFileSync } from 'node:fs';
          const xcrun = args => execFileSync('xcrun', args, {
            encoding: 'utf8', timeout: 60000, killSignal: 'SIGKILL'
          });
          const sdk = xcrun(['--sdk', 'iphonesimulator', '--show-sdk-version']).trim();
          const versionPair = version => version.split('.').slice(0, 2).join('.');
          const runtimes = JSON.parse(xcrun(['simctl', 'list', 'runtimes', '--json'])).runtimes;
          const runtime = runtimes.find(runtime => runtime.isAvailable &&
            runtime.identifier.startsWith('com.apple.CoreSimulator.SimRuntime.iOS-') &&
            versionPair(runtime.version) === versionPair(sdk));
          if (!runtime) throw new Error(`No installed iOS simulator runtime matches Xcode's ${sdk} SDK`);
          const inventory = JSON.parse(xcrun(['simctl', 'list', 'devices', 'available', '--json']));
          const devices = (inventory.devices[runtime.identifier] ?? [])
            .filter(device => device.isAvailable && device.name.startsWith('iPhone'));
          const device = devices.find(device => device.name === 'iPhone 17 Pro') ?? devices[0];
          if (!device) throw new Error(`No available iPhone simulator for iOS ${runtime.version}`);
          console.log(`Selected ${device.name}, iOS ${runtime.version}, SDK ${sdk}, UDID ${device.udid}`);
          appendFileSync(process.env.GITHUB_ENV,
            `LOCALMINUTES_SCREENSHOT_SIMULATOR=${device.udid}\n` +
            `LOCALMINUTES_SCREENSHOT_DEVICE=${device.name} (${runtime.identifier})\n`);
          if (device.state !== 'Booted') xcrun(['simctl', 'boot', device.udid]);
          console.log('Boot requested; the next step waits for startup to finish.');
          JS
      - name: Wait for simulator startup (maximum 5 minutes)
        id: simulator_ready
        timeout-minutes: 5
        run: xcrun simctl bootstatus "$LOCALMINUTES_SCREENSHOT_SIMULATOR" -b
      - name: Report simulator startup failure
        if: failure() && steps.simulator_ready.outcome == 'failure'
        timeout-minutes: 1
        run: |
          echo '::error::The simulator failed to become ready within 5 minutes. App screenshot tests have not started.'
          xcrun simctl list devices available
      - name: Capture independent app scenes
        id: capture_scenes
        run: |
          xcodebuild test -project LocalMinutes.xcodeproj -scheme LocalMinutesUIValidation \
            -configuration Debug -destination "platform=iOS Simulator,id=$LOCALMINUTES_SCREENSHOT_SIMULATOR" \
            -destination-timeout 120 -parallel-testing-enabled NO -collect-test-diagnostics never \
            -testLanguage en -testRegion US \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 1800 \
            -maximum-test-execution-time-allowance 1800 \
            -only-testing:LocalMinutesUITests/AppScreenshotsUITests \
            -derivedDataPath build/screenshots -clonedSourcePackagesDirPath .agent-local/source-packages \
            -resultBundlePath .agent-local/app-screenshots.xcresult \
            CODE_SIGNING_ALLOWED=NO LOCALMINUTES_SOURCE_COMMIT="$GITHUB_SHA" \
            2>&1 | tee .agent-local/app-screenshots.log
          node scripts/verify-test-log.mjs .agent-local/app-screenshots.log
      - name: Export screenshots and failure diagnostics
        id: export_screenshots
        if: ${{ !cancelled() && (steps.capture_scenes.outcome == 'success' || steps.capture_scenes.outcome == 'failure') }}
        timeout-minutes: 5
        env:
          CAPTURE_OUTCOME: ${{ steps.capture_scenes.outcome }}
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { existsSync } from 'node:fs';
          if (existsSync('.agent-local/app-screenshots.xcresult')) {
            try {
              execFileSync('xcrun', ['xcresulttool', 'export', 'attachments',
                '--path', '.agent-local/app-screenshots.xcresult',
                '--output-path', '.agent-local/screenshot-attachments'],
                { stdio: 'inherit', timeout: 120000, killSignal: 'SIGKILL' });
            } catch (error) {
              console.error(`Attachment export failed; preserving the capture log: ${error.message}`);
            }
          }
          JS
          node scripts/app-screenshots.mjs .agent-local/screenshot-attachments AppUI_Screenshots \
            "$GITHUB_SHA" "$LOCALMINUTES_SCREENSHOT_DEVICE" "$CAPTURE_OUTCOME" .agent-local/app-screenshots.log \
            .agent-local/screenshot-selection.json
      - uses: actions/upload-artifact@v4
        id: transfer
        if: ${{ !cancelled() && steps.export_screenshots.outcome == 'success' }}
        with:
          name: app-ui-screenshots-transfer
          path: AppUI_Screenshots/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Require a complete screenshot set
        if: ${{ !cancelled() && steps.export_screenshots.outcome == 'success' }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import { verifyScreenshots } from './scripts/app-screenshots.mjs';
          const selection = JSON.parse(readFileSync('.agent-local/screenshot-selection.json', 'utf8'));
          await verifyScreenshots('AppUI_Screenshots', process.env.GITHUB_SHA, selection);
          JS

  transfer:
    name: Wait for local download and delete temporary screenshots
    if: ${{ always() && needs.capture.outputs.artifact_id != '' }}
    needs: capture
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: write
    steps:
      - name: Wait up to 15 minutes for the download script
        uses: actions/github-script@v7
        env:
          ARTIFACT_ID: ${{ needs.capture.outputs.artifact_id }}
        with:
          script: |
            const artifact_id = Number(process.env.ARTIFACT_ID);
            if (!Number.isSafeInteger(artifact_id) || artifact_id <= 0) throw new Error('Missing transfer artifact');
            const deadline = Date.now() + 15 * 60 * 1000;
            while (Date.now() < deadline) {
              try { await github.rest.actions.getArtifact({ ...context.repo, artifact_id }); }
              catch (error) { if (error.status === 404) return; throw error; }
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            core.setFailed('Local transfer timed out; temporary screenshots will be deleted.');
      - name: Delete temporary artifact even if transfer fails
        if: always()
        uses: actions/github-script@v7
        env:
          ARTIFACT_ID: ${{ needs.capture.outputs.artifact_id }}
        with:
          script: |
            const artifact_id = Number(process.env.ARTIFACT_ID);
            if (!Number.isSafeInteger(artifact_id) || artifact_id <= 0) throw new Error('Missing transfer artifact');
            try { await github.rest.actions.deleteArtifact({ ...context.repo, artifact_id }); }
            catch (error) { if (error.status !== 404) throw error; }
